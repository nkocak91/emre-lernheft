<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D4ED8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernheft">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='3' y='2' width='20' height='22' rx='3' fill='%231D4ED8'/%3E%3Cpath d='M8 2v22' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<title>Emres Lernheft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;700;800&family=Caveat:wght@600&display=swap">
<style>
/* Layout: ein Schulheft auf Karopapier. Eine schmale Spalte (Handy zuerst), oben eine feste Leiste, Inhalte als Heftseiten. */
:root{
  --paper:#F7F9FC; --sheet:#FFFFFF; --grid:rgba(60,100,180,.075);
  --ink:#16223A; --ink-soft:#4B5873; --line:#D9E0EC;
  --blue:#1D4ED8; --blue-soft:#E3EBFF;
  --red:#C8312F; --red-soft:#FCE8E6;
  --green:#18794E; --green-soft:#E1F4EA;
  --marker:#FFE45C; --marker-ink:#3A3000;
  --s-mathe:#1D4ED8; --s-deutsch:#C8312F; --s-englisch:#B7791F; --s-bwr:#18794E; --s-physik:#7C3AED;
  --f-display:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Caveat", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F141D; --sheet:#171E2B; --grid:rgba(140,170,230,.06);
  --ink:#E8EDF7; --ink-soft:#A3AEC4; --line:#2B3547;
  --blue:#8DAEFF; --blue-soft:#1E2B4A;
  --red:#FF8A80; --red-soft:#3A1F22;
  --green:#6FD3A0; --green-soft:#16302A;
  --marker:#6B5A0E; --marker-ink:#FFF4C2;
  --s-mathe:#8DAEFF; --s-deutsch:#FF8A80; --s-englisch:#F2C46B; --s-bwr:#6FD3A0; --s-physik:#C4A5FF;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0F141D; --sheet:#171E2B; --grid:rgba(140,170,230,.06);
  --ink:#E8EDF7; --ink-soft:#A3AEC4; --line:#2B3547;
  --blue:#8DAEFF; --blue-soft:#1E2B4A;
  --red:#FF8A80; --red-soft:#3A1F22;
  --green:#6FD3A0; --green-soft:#16302A;
  --marker:#6B5A0E; --marker-ink:#FFF4C2;
  --s-mathe:#8DAEFF; --s-deutsch:#FF8A80; --s-englisch:#F2C46B; --s-bwr:#6FD3A0; --s-physik:#C4A5FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--f-display);font-weight:800;font-size:1.1rem;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.logo svg{flex:none}
.crumb{color:var(--ink-soft);font-size:.92rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{margin-left:auto;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-size:.92rem}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hand{font-family:var(--f-hand);font-size:1.45rem;color:var(--blue);line-height:1.1}
.muted{color:var(--ink-soft)}
.small{font-size:.9rem}

.hello{display:flex;flex-direction:column;gap:8px}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.subj{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;border-top:6px solid var(--c);text-decoration:none;color:var(--ink)}
.subj:hover{border-color:var(--c)}
.subj .n{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.subj .d{font-size:.92rem;color:var(--ink-soft)}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c,var(--blue));border-radius:99px}
.meter-row{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.meter-row .meter{flex:1}

.plan ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}

.topics{display:flex;flex-direction:column;gap:10px}
.topic{display:flex;gap:14px;align-items:flex-start;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.topic:hover{border-color:var(--c)}
.topic .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.topic .t{font-family:var(--f-display);font-weight:700}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:2px}
.chk.on{background:var(--green);border-color:var(--green);color:var(--sheet)}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--blue-soft);color:var(--blue);width:fit-content}
.tag.i{background:var(--red-soft);color:var(--red)}
.tag.probe{background:var(--marker);color:var(--marker-ink)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.2;margin:0 2px;font-variant-numeric:tabular-nums}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.vec{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.2;padding:1px 7px;border-left:2px solid currentColor;border-right:2px solid currentColor;border-radius:9px;margin:0 2px;font-variant-numeric:tabular-nums}
.warn{border:2px solid var(--red);background:var(--red-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.warn>b:first-child{color:var(--red);font-family:var(--f-display)}
.lv{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.lv i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lv i.on{background:var(--blue)}
.keys{display:flex;gap:6px}
.key{border:1px solid var(--line);background:var(--paper);border-radius:8px;min-width:44px;min-height:44px;font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.probe-card{border:2px solid var(--s-mathe);background:var(--sheet);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.probe-card .row a{text-decoration:none}
.qq input{min-height:44px}
.opt{min-height:48px}

.head{display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--c);padding-left:14px}

.toc{display:flex;flex-wrap:wrap;gap:8px}
.toc a{font-size:.88rem;text-decoration:none;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:5px 12px;border-radius:99px}

.sec-title{display:flex;align-items:baseline;gap:10px}
.sec-title .no{font-family:var(--f-display);font-weight:800;color:var(--c);font-size:1.3rem}

.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-family:var(--f-display);font-weight:800;display:grid;place-items:center}
.steps li>div{min-width:0}

.merke{background:var(--sheet);border:2px solid var(--ink);border-radius:4px;padding:16px 18px;position:relative;display:flex;flex-direction:column;gap:8px}
.merke::before{content:"Merke";font-family:var(--f-hand);font-size:1.5rem;color:var(--red);position:absolute;top:-20px;left:12px;background:var(--sheet);padding:0 6px;line-height:1.2}
mark{background:var(--marker);color:var(--marker-ink);padding:0 3px;border-radius:2px}

.f{font-family:var(--f-display);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.calc{font-family:var(--f-display);font-variant-numeric:tabular-nums;background:var(--paper);border-radius:8px;padding:10px 14px;overflow-x:auto;line-height:1.9}
.fig{overflow-x:auto;display:flex;justify-content:center}
.fig svg{max-width:100%;height:auto}
.cap{font-size:.88rem;color:var(--ink-soft);text-align:center}

.ex{border:1px dashed var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ex .q{font-weight:700}
.ex ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.ex li[hidden]{display:none}
.ex .res{background:var(--green-soft);color:var(--green);font-weight:700;border-radius:8px;padding:8px 12px}
.btn{border:0;background:var(--blue);color:var(--sheet);padding:10px 18px;border-radius:10px;font-weight:700;width:fit-content}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.btn.ok{background:var(--green)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.err{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err>div{border-radius:10px;padding:10px 12px;min-width:0}
.err .no{background:var(--red-soft)}
.err .yes{background:var(--green-soft)}
.err .no b{color:var(--red)} .err .yes b{color:var(--green)}
.err .why{grid-column:1/-1;font-size:.95rem;color:var(--ink-soft);padding:0 2px 6px}
.strike{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}

.quiz{display:flex;flex-direction:column;gap:14px}
.qq{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.qq .qn{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700}
.qq input{font:inherit;font-family:var(--f-display);font-size:1.05rem;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:9em;max-width:100%}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 14px}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.fb{border-radius:10px;padding:10px 12px;font-size:.96rem}
.fb.good{background:var(--green-soft);color:var(--green)}
.fb.bad{background:var(--red-soft);color:var(--red)}
.fb .sol{color:var(--ink);display:block;margin-top:6px}
.score{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}

.done{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between}

table.t{border-collapse:collapse;width:100%;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--paper);font-family:var(--f-display);font-weight:700}
.tbl{overflow-x:auto}

/* SVG Farben aus Tokens */
.sv{font-family:var(--f-body)}
.sv text{fill:var(--ink);font-size:15px}
.sv .lbl{font-family:var(--f-display);font-weight:700}
.sv .hand{font-family:var(--f-hand);font-size:22px;fill:var(--blue)}
.sv .grid{stroke:var(--line);stroke-width:1}
.sv .axis{stroke:var(--ink);stroke-width:1.6;fill:none}
.sv .tick{fill:var(--ink-soft);font-size:12px}
.sv .ln1{stroke:var(--blue);stroke-width:3;fill:none}
.sv .ln2{stroke:var(--red);stroke-width:3;fill:none}
.sv .ln3{stroke:var(--green);stroke-width:3;fill:none}
.sv .help{stroke:var(--green);stroke-width:2.5;fill:none;stroke-dasharray:6 5}
.sv .dot{fill:var(--ink)}
.sv .dotr{fill:var(--red)}
.sv .shape{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2.5}
.sv .shape2{fill:var(--red-soft);stroke:var(--red);stroke-width:2.5}
.sv .shape3{fill:var(--green-soft);stroke:var(--green);stroke-width:2.5}
.sv .edge{stroke:var(--ink);stroke-width:2.5;fill:none}
.sv .thin{stroke:var(--ink-soft);stroke-width:1.4;fill:none;stroke-dasharray:4 4}
.sv .cell{fill:none;stroke:var(--blue);stroke-width:1;opacity:.5}
.sv .box{fill:var(--paper);stroke:var(--line);stroke-width:1.5}

@media (max-width:520px){
  body{font-size:16px}
  .sheet{padding:18px 16px}
  .err{grid-template-columns:1fr}
  h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:no-preference){
  .opt,.btn,.subj,.topic{transition:border-color .15s, background .15s}
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<header class="bar"><div class="bar-in">
  <a class="logo" href="#start" aria-label="Zur Startseite">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="2" width="20" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 2v22" stroke="currentColor" stroke-width="2"/><path d="M12 9h7M12 13h7M12 17h5" stroke="currentColor" stroke-width="1.6"/></svg>
    Emres Lernheft
  </a>
  <span class="crumb" id="crumb"></span>
  <button class="back" id="back" hidden>Zurück</button>
</div></header>
<main><div class="wrap" id="app"></div></main>

<script>
/* ---------- Hilfsfunktionen für Skizzen ---------- */
let clipN=0;
function koord(o){
  const u=o.u||28,pad=24,W=(o.xmax-o.xmin)*u,H=(o.ymax-o.ymin)*u;
  const X=x=>pad+(x-o.xmin)*u, Y=y=>pad+(o.ymax-y)*u;
  let g='';
  for(let x=o.xmin;x<=o.xmax;x++) g+=`<line class="grid" x1="${X(x)}" y1="${Y(o.ymin)}" x2="${X(x)}" y2="${Y(o.ymax)}"/>`;
  for(let y=o.ymin;y<=o.ymax;y++) g+=`<line class="grid" x1="${X(o.xmin)}" y1="${Y(y)}" x2="${X(o.xmax)}" y2="${Y(y)}"/>`;
  g+=`<path class="axis" d="M${X(o.xmin)} ${Y(0)}H${X(o.xmax)+10}M${X(o.xmax)+3} ${Y(0)-5}l7 5-7 5"/>`;
  g+=`<path class="axis" d="M${X(0)} ${Y(o.ymin)}V${Y(o.ymax)-10}M${X(0)-5} ${Y(o.ymax)-3}l5-7 5 7"/>`;
  g+=`<text class="tick" x="${X(o.xmax)+4}" y="${Y(0)+18}">x</text><text class="tick" x="${X(0)+8}" y="${Y(o.ymax)-4}">y</text>`;
  for(let x=o.xmin;x<=o.xmax;x++) if(x!==0) g+=`<text class="tick" text-anchor="middle" x="${X(x)}" y="${Y(0)+15}">${x}</text>`;
  for(let y=o.ymin;y<=o.ymax;y++) if(y!==0) g+=`<text class="tick" text-anchor="end" x="${X(0)-5}" y="${Y(y)+4}">${y}</text>`;
  const id='c'+(++clipN);
  let f='';
  (o.fns||[]).forEach(fn=>{
    let d='';const n=240;
    for(let i=0;i<=n;i++){const x=o.xmin+(o.xmax-o.xmin)*i/n;d+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(fn.f(x)).toFixed(1);}
    f+=`<path class="${fn.cls}" d="${d}"/>`;
  });
  let ex=o.extra?o.extra(X,Y):'';
  let p='';
  (o.pts||[]).forEach(pt=>{p+=`<circle class="${pt.cls||'dot'}" cx="${X(pt.x)}" cy="${Y(pt.y)}" r="5"/>`+(pt.l?`<text class="lbl" x="${X(pt.x)+(pt.dx||8)}" y="${Y(pt.y)+(pt.dy||-8)}">${pt.l}</text>`:'');});
  return `<svg class="sv" viewBox="0 0 ${W+pad*2} ${H+pad*2}" width="${W+pad*2}" role="img" aria-label="${o.alt||'Koordinatensystem'}">
  <defs><clipPath id="${id}"><rect x="${pad}" y="${pad}" width="${W}" height="${H}"/></clipPath></defs>
  ${g}<g clip-path="url(#${id})">${f}${ex}</g>${p}</svg>`;
}

const IMG={
quadrat:()=>{let c='';for(let i=0;i<5;i++)for(let j=0;j<5;j++)c+=`<rect class="cell" x="${40+i*36}" y="${20+j*36}" width="36" height="36"/>`;
 return `<svg class="sv" viewBox="0 0 420 230" width="420" role="img" aria-label="Quadrat mit 25 Kästchen, Seitenlänge 5">
 <rect class="shape" x="40" y="20" width="180" height="180"/>${c}
 <text class="lbl" x="130" y="222" text-anchor="middle">Seite = 5</text>
 <text class="lbl" x="250" y="90">Fläche = 25 Kästchen</text>
 <text class="hand" x="250" y="130">√25 = 5,</text>
 <text class="hand" x="250" y="160">weil 5 · 5 = 25</text></svg>`;},
mengen:()=>`<svg class="sv" viewBox="0 0 460 280" width="460" role="img" aria-label="Zahlenmengen ineinander: N in Z in Q in R">
 <rect class="box" x="6" y="6" width="448" height="268" rx="22"/>
 <rect class="shape3" x="26" y="40" width="300" height="220" rx="20" style="fill-opacity:.6"/>
 <rect class="shape2" x="46" y="74" width="200" height="172" rx="18" style="fill-opacity:.6"/>
 <rect class="shape" x="66" y="108" width="110" height="124" rx="16"/>
 <text class="lbl" x="22" y="30">ℝ reelle Zahlen</text><text class="lbl" x="42" y="64">ℚ Brüche</text>
 <text class="lbl" x="62" y="98">ℤ ganze</text><text class="lbl" x="80" y="132">ℕ</text>
 <text x="80" y="160">1; 2; 3</text><text x="80" y="185">17</text>
 <text x="186" y="160">−4</text><text x="190" y="190">0</text>
 <text x="256" y="120">½</text><text x="256" y="160">0,75</text><text x="256" y="200">−2,3</text>
 <text x="350" y="110">√2</text><text x="350" y="150">π</text><text x="350" y="190">√7</text>
 <text class="hand" x="340" y="240">nicht als</text><text class="hand" x="340" y="262">Bruch schreibbar</text></svg>`,
pyth:()=>`<svg class="sv" viewBox="0 0 430 470" width="400" role="img" aria-label="Rechtwinkliges Dreieck mit Quadraten auf allen Seiten, 9 plus 16 gleich 25">
 <polygon class="shape2" points="0,170 120,170 120,290 0,290" style="fill-opacity:.8"/>
 <polygon class="shape3" points="120,290 280,290 280,450 120,450" style="fill-opacity:.8"/>
 <polygon class="shape" points="120,170 280,290 400,130 240,10"/>
 <polygon class="edge" points="120,170 280,290 120,290" style="fill:var(--sheet)"/>
 <path class="edge" d="M120 270h20v20" style="stroke-width:1.8"/>
 <text class="lbl" x="128" y="262" style="fill:var(--red)">a = 3</text>
 <text class="lbl" x="200" y="312" text-anchor="middle" style="fill:var(--green)">b = 4</text>
 <text class="lbl" x="214" y="222" style="fill:var(--blue)">c = 5</text>
 <text class="lbl" x="60" y="236" text-anchor="middle">a² = 9</text>
 <text class="lbl" x="200" y="380" text-anchor="middle">b² = 16</text>
 <text class="lbl" x="262" y="150" text-anchor="middle">c² = 25</text>

mathe:{name:'Mathe',c:'var(--s-mathe)',desc:'Lineare Funktionen (Probe-Thema), Wurzeln, Strahlensätze, Pythagoras, Gleichungssysteme',topics:[
{id:'m-lin-grund',t:'Lineare Funktionen: y = mx + t',kurz:'Normalform lesen, Gerade zeichnen, Punktprobe',tag:'Probe-Thema',probe:1,
intro:`<p>Eine lineare Funktion hat die Form <span class="f">y = m · x + t</span>. Das heißt <b>Normalform der Geradengleichung</b>. Ihr Graph ist immer eine <b>Gerade</b>.</p>
<p><b>m</b> ist die <b>Steigung</b>: Wie steil ist die Gerade, und geht sie hoch oder runter?</p>
<p><b>t</b> ist der <b>y-Achsenabschnitt</b>: An diesem Punkt schneidet die Gerade die y-Achse. Der Punkt heißt immer <b>(0 | t)</b>.</p>
<p>In deinem Heft steht <b>𝔻 = ℚ</b>. Das heißt: Für x darfst du jede Zahl einsetzen, auch Brüche und negative Zahlen.</p>`,
img:()=>koord({xmin:-4,xmax:5,ymin:-2,ymax:6,u:30,alt:'Gerade f: y = ½x + 3 mit Steigungsdreieck und y-Achsenabschnitt 3',fns:[{f:x=>x/2+3,cls:'ln1'},{f:x=>x/2,cls:'ln3'}],
 extra:(X,Y)=>`<path class="help" d="M${X(0)} ${Y(3)}H${X(2)}V${Y(4)}" style="stroke:var(--red)"/><text class="lbl" x="${X(0.5)}" y="${Y(3)+20}" style="fill:var(--red)">2 rechts</text><text class="lbl" x="${X(2)+6}" y="${Y(3.5)+5}" style="fill:var(--red)">1 hoch</text><text class="lbl" x="${X(2.6)}" y="${Y(5)}" style="fill:var(--blue)">f: y = ½x + 3</text><text class="lbl" x="${X(2.6)}" y="${Y(0.6)}" style="fill:var(--green)">g: y = ½x</text>`,
 pts:[{x:0,y:3,l:'(0|3)',dx:-50,dy:-6}]}),cap:'Blau: y = ½x + 3. Sie schneidet die y-Achse bei 3. Steigung ½ heißt 2 nach rechts, 1 nach oben.',
steps:[
[`m und t ablesen`,`<b>m</b> ist die Zahl direkt vor dem x. <b>t</b> ist die Zahl ohne x. Das Vorzeichen gehört immer dazu!
<div class="tbl"><table class="t"><tr><th>Gleichung</th><th>m</th><th>t</th></tr>
<tr><td>y = ½x + 3</td><td>½</td><td>3</td></tr><tr><td>y = −2x + 5</td><td>−2</td><td>5</td></tr>
<tr><td>y = x − 4</td><td>1 (unsichtbare 1)</td><td>−4</td></tr><tr><td>y = −x</td><td>−1</td><td>0</td></tr>
<tr><td>y = 3 − 5x</td><td>−5 (steht hinten!)</td><td>3</td></tr><tr><td>y = 2</td><td>0 (waagrecht)</td><td>2</td></tr></table></div>`],
[`Ersten Punkt setzen: (0 | t)`,`Geh auf die y-Achse zur Zahl t und mach ein Kreuz. Bei y = ½x + 3 ist das bei 3.`],
[`Steigung als Bruch schreiben`,`m = ${fr('hoch / runter','rechts')}. Eine ganze Zahl bekommt einfach eine 1 drunter: m = 3 = ${fr('3','1')}.
<div class="calc">m = ½ → 2 nach rechts, 1 nach oben<br>m = −⅓ → 3 nach rechts, 1 nach unten<br>m = 3 → 1 nach rechts, 3 nach oben</div>`],
[`Steigungsdreieck zeichnen`,`Vom ersten Punkt aus: erst nach <b>rechts</b> (Nenner), dann <b>hoch</b> (bei +) oder <b>runter</b> (bei −). Dort zweites Kreuz.`],
[`Gerade durchziehen`,`Lineal an beide Kreuze, Linie über das ganze Koordinatensystem ziehen. Gerade benennen (g, f, h).`],
[`Punktprobe: Liegt ein Punkt auf der Geraden?`,`x-Wert vom Punkt einsetzen und ausrechnen. Kommt der y-Wert vom Punkt raus? Dann liegt er drauf.
<div class="calc">P(4 | 5) und y = ½x + 3: &nbsp; ½ · 4 + 3 = 2 + 3 = 5 ✓ liegt drauf<br>Q(2 | 5): &nbsp; ½ · 2 + 3 = 4 ≠ 5 ✗ liegt nicht drauf</div>`],
[`Steigt oder fällt sie?`,`m positiv: Gerade geht von links nach rechts <b>hoch</b>. m negativ: Sie geht <b>runter</b>. m = 0: waagrecht. Je größer die Zahl (ohne Vorzeichen), desto steiler.`]],
merke:`<p><b>y = m · x + t</b> (Normalform)</p><p>m = Steigung &nbsp;&nbsp; t = y-Achsenabschnitt, Punkt (0 | t)</p><p><mark>Das Vorzeichen gehört zur Zahl: y = 3 − 5x → m = −5, t = 3.</mark></p><p>Steigung immer als Bruch: ${fr('hoch','rechts')}</p>`,
bsp:[{q:`Zeichne die Gerade g: y = −⅔x + 2.`,s:[`t = 2 ablesen. Erstes Kreuz auf der y-Achse bei (0 | 2).`,`m = −⅔. Der Nenner 3 heißt: 3 nach rechts. Der Zähler 2 mit Minus heißt: 2 nach unten.`,`Von (0 | 2) aus 3 nach rechts und 2 nach unten. Du landest bei (3 | 0).`,`Kontrolle mit Rechnung: −⅔ · 3 + 2 = −2 + 2 = 0. Passt.`,`Lineal an (0 | 2) und (3 | 0), durchziehen. Die Gerade fällt, weil m negativ ist.`],r:`Gerade durch (0 | 2) und (3 | 0), fallend.`},
{q:`Liegt der Punkt P(−6 | 0) auf f: y = ½x + 3?`,s:[`x = −6 einsetzen: y = ½ · (−6) + 3.`,`½ · (−6) = −3. Negative Zahlen beim Einsetzen immer in Klammern.`,`−3 + 3 = 0. Das ist genau der y-Wert von P.`],r:`Ja, P liegt auf f. (Es ist sogar die Nullstelle, also der Schnittpunkt mit der x-Achse.)`},
{q:`Ein Handytarif kostet 8 € Grundgebühr im Monat und 0,05 € pro Minute. Stell die Gleichung auf. Was kosten 200 Minuten?`,s:[`Was immer gleich bleibt, ist t: t = 8.`,`Was pro Minute dazukommt, ist m: m = 0,05.`,`Gleichung: y = 0,05x + 8. Dabei ist x = Minuten und y = Kosten in €.`,`x = 200 einsetzen: y = 0,05 · 200 + 8 = 10 + 8.`],r:`y = 0,05x + 8. 200 Minuten kosten 18 €.`}],
fehler:[[`y = 3 − 5x: m = 3, t = −5`,`m = −5, t = 3`,`m ist immer die Zahl beim x, egal ob vorne oder hinten.`],
[`m = ½: 1 nach rechts, 2 nach oben`,`2 nach rechts, 1 nach oben`,`Unten (Nenner) = rechts, oben (Zähler) = hoch. Wie ein Stockwerk: Erst laufen, dann Treppe.`],
[`y = −x + 4: m = 1`,`m = −1`,`Vor dem x steht eine unsichtbare 1, aber das Minus bleibt.`],
[`½ · −6 + 3 ohne Klammern rechnen`,`½ · (−6) + 3`,`Negative Zahlen beim Einsetzen immer einklammern, sonst passieren Vorzeichenfehler.`]],
quiz:[{l:1,q:`y = 4x − 7. Wie groß ist t?`,a:-7},{l:1,q:`y = −x + 2. Wie groß ist m?`,a:-1,h:`Vor dem x steht eine unsichtbare 1.`},{l:1,q:`y = 3 − 5x. Wie groß ist m?`,a:-5,h:`Die Zahl beim x, mit Vorzeichen.`},
{l:2,q:`m = ¾. Wie zeichnest du das Steigungsdreieck?`,o:[`3 rechts, 4 hoch`,`4 rechts, 3 hoch`,`4 rechts, 3 runter`,`3 rechts, 4 runter`],a:1,h:`Nenner = rechts, Zähler = hoch.`},
{l:2,q:`Liegt P(2 | 1) auf y = −2x + 5?`,o:[`Ja`,`Nein`],a:0,h:`−2 · 2 + 5 = ?`},
{l:2,q:`y = ½x + 3. Wie groß ist y bei x = 6?`,a:6},
{l:3,q:`Für welches t liegt P(4 | 1) auf y = ½x + t?`,a:-1,h:`1 = ½ · 4 + t, also 1 = 2 + t`},

{id:'m-lin-steigung',t:'Steigung berechnen: 3 Wege',kurz:'Steigungsdreieck, Vektor und Formel',tag:'Probe-Thema',probe:1,
intro:`<p>Du hast zwei Punkte A und B und willst die Steigung m. Dafür gibt es <b>drei Wege</b>. Alle drei liefern dasselbe Ergebnis. Nimm den, den du am besten verstehst, und prüf mit einem zweiten.</p>
<p>Beispiel aus deinem Heft: <b>A(8 | 4)</b> und <b>B(4 | 2)</b>.</p>`,
img:()=>koord({xmin:-1,xmax:9,ymin:-1,ymax:5,u:32,alt:'Gerade durch B(4|2) und A(8|4) mit Steigungsdreieck 4 nach rechts und 2 nach oben',fns:[{f:x=>x/2,cls:'ln1'}],
 extra:(X,Y)=>`<path class="help" d="M${X(4)} ${Y(2)}H${X(8)}V${Y(4)}" style="stroke:var(--red)"/><text class="lbl" x="${X(6)}" y="${Y(2)+20}" text-anchor="middle" style="fill:var(--red)">4 rechts</text><text class="lbl" x="${X(8)+6}" y="${Y(3)+5}" style="fill:var(--red)">2 hoch</text>`,
 pts:[{x:4,y:2,l:'B(4|2)',dx:-30,dy:-12},{x:8,y:4,l:'A(8|4)',dx:-60,dy:-10}]}),cap:'Von B nach A: 4 nach rechts, 2 nach oben. m = 2/4 = ½.',
steps:[
[`Weg 1: Steigungsdreieck (Kästchen zählen)`,`Zeichne beide Punkte ein. Geh vom linken Punkt waagrecht nach rechts, bis du unter (oder über) dem anderen Punkt bist. Zähl die Kästchen: <b>4</b>. Dann senkrecht bis zum Punkt: <b>2 hoch</b>.
<div class="calc">m = ${fr('hoch','rechts')} = ${fr('2','4')} = ½</div>Musst du nach unten, ist m negativ.`],
[`Weg 2: Vektor (wie im Heft)`,`Der Vektor von B nach A heißt ${'<span class="f">BA→</span>'}. Rechnung: <b>Spitze minus Fuß</b>, also A minus B.
<div class="calc">BA→ = ${vec('8 − 4','4 − 2')} = ${vec('4','2')}</div>Oben steht, wie weit nach rechts, unten, wie weit nach oben. Jetzt „umdrehen und als Bruch schreiben“: <b>untere Zahl durch obere Zahl</b>.
<div class="calc">m = ${fr('2','4')} = ½</div>`],
[`Weg 3: Formel`,`Ohne Zeichnung, nur rechnen:<div class="calc">m = ${fr('y<sub>A</sub> − y<sub>B</sub>','x<sub>A</sub> − x<sub>B</sub>')} = ${fr('4 − 2','8 − 4')} = ${fr('2','4')} = ½</div>Oben die y-Werte, unten die x-Werte. Oben und unten in <b>derselben Reihenfolge</b> (A zuerst, dann B).`],
[`Negative Zahlen: Klammern!`,`Bei A(4 | 5) und B(−4 | 3):<div class="calc">x<sub>A</sub> − x<sub>B</sub> = 4 − (−4) = 4 + 4 = 8</div>Minus minus wird plus.`],
[`Kürzen`,`${fr('2','8')} = ¼, ${fr('6','4')} = ${fr('3','2')}, ${fr('−4','−2')} = 2. Minus durch Minus ist plus.`],
[`Kontrolle mit Blick`,`Geht die Gerade von links nach rechts hoch? Dann muss m positiv sein. Geht sie runter? Dann negativ. Passt das nicht, hast du ein Vorzeichen verdreht.`]],
merke:`<p><b>m = ${fr('y<sub>A</sub> − y<sub>B</sub>','x<sub>A</sub> − x<sub>B</sub>')}</b> &nbsp; = ${fr('hoch','rechts')}</p><p>Vektor ${vec('rechts','hoch')} → m = ${fr('untere Zahl','obere Zahl')}</p><p><mark>y oben, x unten. Oben und unten dieselbe Reihenfolge.</mark></p>`,
bsp:[{q:`Aus deinem Heft: A(4 | 5), B(−4 | 3). Berechne m.`,s:[`Formel hinschreiben: m = (y<sub>A</sub> − y<sub>B</sub>) : (x<sub>A</sub> − x<sub>B</sub>).`,`Oben: 5 − 3 = 2.`,`Unten: 4 − (−4) = 4 + 4 = 8.`,`m = ${fr('2','8')}. Kürzen durch 2.`],r:`m = ¼`},
{q:`A(1 | 6), B(3 | 2). Berechne m mit Vektor und mit Formel.`,s:[`Vektor: BA→ = ${vec('1 − 3','6 − 2')} = ${vec('−2','4')}.`,`Umdrehen: m = ${fr('4','−2')} = −2.`,`Formel zur Kontrolle: m = ${fr('6 − 2','1 − 3')} = ${fr('4','−2')} = −2.`,`Beide Wege gleich. Die Gerade fällt (m negativ). Das passt: B liegt weiter rechts und weiter unten als A.`],r:`m = −2`},
{q:`A(−2 | −1), B(4 | 2). Berechne m.`,s:[`Oben: y<sub>A</sub> − y<sub>B</sub> = −1 − 2 = −3.`,`Unten: x<sub>A</sub> − x<sub>B</sub> = −2 − 4 = −6.`,`m = ${fr('−3','−6')}. Minus durch Minus = plus.`],r:`m = ½`}],
fehler:[[`m = ${fr('y<sub>A</sub> − y<sub>B</sub>','x<sub>B</sub> − x<sub>A</sub>')}`,`m = ${fr('y<sub>A</sub> − y<sub>B</sub>','x<sub>A</sub> − x<sub>B</sub>')}`,`Oben A − B, dann unten auch A − B. Sonst stimmt das Vorzeichen nicht.`],
[`Vektor ${vec('4','2')} → m = ${fr('4','2')} = 2`,`m = ${fr('2','4')} = ½`,`Die obere Zahl ist „rechts“, die gehört nach unten in den Bruch. Deshalb „umdrehen“.`],
[`4 − (−4) = 0`,`4 − (−4) = 8`,`Minus minus wird plus.`],
[`m = ${fr('x','y')}`,`m = ${fr('y','x')}`,`Merksatz: „Hoch durch rechts“, so wie ein Bruch aus Etage und Weg.`]],

intro:`<p>Das ist die wichtigste Aufgabe zum Thema und kommt in fast jeder Probe. Du bekommst zwei Punkte und sollst die Gleichung y = mx + t finden.</p><p>Es sind immer <b>die gleichen 3 Schritte</b>, wie in deinem Heft. Plus eine Probe am Ende.</p>`,
img:()=>koord({xmin:-5,xmax:5,ymin:-1,ymax:6,u:30,alt:'Gerade y = ¼x + 4 durch A(4|5) und B(−4|3)',fns:[{f:x=>x/4+4,cls:'ln1'}],
 pts:[{x:4,y:5,l:'A(4|5)',dx:-30,dy:-12},{x:-4,y:3,l:'B(−4|3)',dx:-24,dy:-12},{x:0,y:4,cls:'dotr',l:'t = 4',dx:8,dy:22}]}),cap:'Die Gerade durch A und B schneidet die y-Achse bei 4.',
steps:[
[`Schritt 1: Steigung m berechnen`,`Mit der Formel (oder dem Vektor):<div class="calc">m = ${fr('y<sub>A</sub> − y<sub>B</sub>','x<sub>A</sub> − x<sub>B</sub>')}</div>`],
[`Schritt 2: m und einen Punkt einsetzen`,`Schreib <b>y = mx + t</b> hin. Setz für m deine Steigung ein. Für x und y nimmst du die Koordinaten von <b>einem</b> Punkt (A oder B, egal). Tipp: Nimm den Punkt mit den einfacheren Zahlen.`],
[`Schritt 3: Nach t auflösen`,`Jetzt ist nur noch t unbekannt. Rechne die Seite mit m und x aus, dann bringst du die Zahl auf die andere Seite. Was du links machst, machst du auch rechts.`],
[`Schritt 4: Gleichung aufschreiben`,`m und t in y = mx + t einsetzen. x und y bleiben jetzt als Buchstaben stehen!`],
[`Schritt 5: Probe mit dem anderen Punkt`,`Setz den Punkt ein, den du in Schritt 2 <b>nicht</b> genommen hast. Kommt sein y-Wert raus, ist alles richtig.`]],
merke:`<p><b>1.</b> m berechnen &nbsp; <b>2.</b> m und Punkt in y = mx + t einsetzen &nbsp; <b>3.</b> t ausrechnen &nbsp; <b>4.</b> Gleichung hinschreiben &nbsp; <b>5.</b> Probe</p><p><mark>Liegt ein Punkt auf der y-Achse, z. B. (0 | 3), dann ist t sofort 3.</mark></p>`,
bsp:[{q:`Aus deinem Heft: A(4 | 5), B(−4 | 3). Bestimme die Geradengleichung.`,s:[`Schritt 1: m = ${fr('5 − 3','4 − (−4)')} = ${fr('2','8')} = ¼.`,`Schritt 2: A(4 | 5) einsetzen: 5 = ¼ · 4 + t.`,`¼ · 4 = 1. Also: 5 = 1 + t.`,`Schritt 3: Auf beiden Seiten − 1: 4 = t.`,`Schritt 4: y = ¼x + 4.`,`Schritt 5, Probe mit B(−4 | 3): ¼ · (−4) + 4 = −1 + 4 = 3 ✓`],r:`g: y = ¼x + 4`},
{q:`A(2 | 1), B(6 | −7). Bestimme die Geradengleichung.`,s:[`m = ${fr('1 − (−7)','2 − 6')} = ${fr('8','−4')} = −2.`,`A einsetzen: 1 = −2 · 2 + t, also 1 = −4 + t.`,`Auf beiden Seiten + 4: t = 5.`,`Gleichung: y = −2x + 5.`,`Probe mit B: −2 · 6 + 5 = −12 + 5 = −7 ✓`],r:`g: y = −2x + 5`},
{q:`A(3 | 2), B(−3 | −2). Bestimme die Geradengleichung.`,s:[`m = ${fr('2 − (−2)','3 − (−3)')} = ${fr('4','6')} = ⅔.`,`A einsetzen: 2 = ⅔ · 3 + t.`,`⅔ · 3 = 2. Also 2 = 2 + t, damit t = 0.`,`Gleichung: y = ⅔x. Bei t = 0 geht die Gerade durch den Ursprung (0 | 0).`,`Probe mit B: ⅔ · (−3) = −2 ✓`],r:`g: y = ⅔x`}],
fehler:[[`5 − 1 + t &nbsp;| − 1`,`5 = 1 + t &nbsp;| − 1`,`Das Gleichheitszeichen nie weglassen. So steht es auch in deinem Heft, da fehlt es. Ohne „=“ ist es keine Gleichung mehr.`],
[`Am Ende: 4 = ¼x + 4`,`y = ¼x + 4`,`In die fertige Gleichung kommen nur m und t. x und y bleiben Buchstaben.`],
[`−2 · (−3) = −6`,`−2 · (−3) = +6`,`Minus mal Minus ist Plus.`],
[`Probe weglassen`,`Immer mit dem zweiten Punkt prüfen`,`Die Probe dauert 20 Sekunden und zeigt dir sofort, ob du Punkte holst.`]],
quiz:[{l:1,q:`A(0 | 3), B(2 | 7). Wie groß ist t?`,a:3,h:`A liegt auf der y-Achse (x = 0).`},
{l:1,q:`A(0 | 3), B(2 | 7). Wie groß ist m?`,a:2},
{l:2,q:`A(1 | 4), B(3 | 8). Wie groß ist t?`,a:2,h:`m = 2. Dann 4 = 2 · 1 + t`},
{l:2,q:`A(2 | 5), B(4 | 9). Welche Gleichung stimmt?`,o:[`y = 2x + 1`,`y = 2x + 5`,`y = 4x − 3`,`y = ½x + 4`],a:0},
{l:3,q:`A(−2 | 5), B(2 | −3). Wie groß ist m?`,a:-2},{l:3,q:`A(−2 | 5), B(2 | −3). Wie groß ist t?`,a:1,h:`5 = −2 · (−2) + t`},
{l:3,q:`A(4 | 1), B(−4 | 5). Welche Gleichung stimmt?`,o:[`y = ½x − 1`,`y = −½x + 3`,`y = −2x + 9`,`y = −½x + 1`],a:1,h:`m = (1 − 5) : (4 + 4) = −½`}]},

{id:'m-lin-parallel',t:'Parallele und senkrechte Geraden',kurz:'Gleiche Steigung, Kehrwert mit Minus',tag:'Probe-Thema',probe:1,
intro:`<p><b>Parallel</b> heißt: Die Geraden laufen nebeneinander her und treffen sich nie. Sie haben die <mark>gleiche Steigung</mark>.</p>
<p><b>Senkrecht</b> (Zeichen ⊥) heißt: Sie kreuzen sich im rechten Winkel (90°).</p>
<div class="warn"><b>Achtung, Heft prüfen!</b> In deinem Heft steht m₂ = ${fr('1','m₁')}. <b>Da fehlt das Minus.</b> Richtig ist:<div class="calc">m₂ = −${fr('1','m₁')} &nbsp;&nbsp; bzw. &nbsp;&nbsp; m₁ · m₂ = −1</div>Der zweite Teil im Heft (m₁ · m₂ = −1) und der Satz „anderes Vorzeichen und Bruch umdrehen“ sind richtig. Ergänz das Minus in der Formel.</div>`,
img:()=>koord({xmin:-4,xmax:4,ymin:-3,ymax:3,u:34,alt:'Senkrechte Geraden y = −⅓x + 1 und y = 3x − 1',fns:[{f:x=>-x/3+1,cls:'ln1'},{f:x=>3*x-1,cls:'ln2'}],
 extra:(X,Y)=>{const p=[0.6,0.8],a=[3/Math.sqrt(10)*0.35,-1/Math.sqrt(10)*0.35],b=[1/Math.sqrt(10)*0.35,3/Math.sqrt(10)*0.35];
 return `<path class="edge" style="stroke-width:1.6" d="M${X(p[0]+a[0])} ${Y(p[1]+a[1])}L${X(p[0]+a[0]+b[0])} ${Y(p[1]+a[1]+b[1])}L${X(p[0]+b[0])} ${Y(p[1]+b[1])}"/><text class="lbl" x="${X(-3.9)}" y="${Y(2.4)}" style="fill:var(--blue)">g₁: y = −⅓x + 1</text><text class="lbl" x="${X(1.25)}" y="${Y(2.6)}" style="fill:var(--red)">g₂: y = 3x − 1</text>`}}),
cap:'Beispiel aus deinem Heft: 3 · (−⅓) = −1, also stehen die Geraden senkrecht aufeinander.',
steps:[
[`Parallel prüfen`,`Vergleiche nur m. Gleiches m, verschiedenes t → parallel.<div class="calc">g: y = ½x + 1 und h: y = ½x − 3 → beide m = ½ → g ∥ h</div>`],
[`Senkrechte Steigung bilden`,`Zwei Dinge gleichzeitig: <b>Bruch umdrehen</b> und <b>Vorzeichen wechseln</b>.
<div class="tbl"><table class="t"><tr><th>m₁</th><th>umdrehen</th><th>Vorzeichen wechseln = m₂</th></tr>
<tr><td>3 = ${fr('3','1')}</td><td>${fr('1','3')}</td><td>−⅓</td></tr><tr><td>−⅓</td><td>−3</td><td>3</td></tr>
<tr><td>⅔</td><td>${fr('3','2')}</td><td>−${fr('3','2')}</td></tr><tr><td>−4</td><td>−¼</td><td>¼</td></tr><tr><td>½</td><td>2</td><td>−2</td></tr></table></div>`],
[`Kontrolle: m₁ · m₂ = −1`,`Multiplizier die beiden Steigungen. Kommt −1 raus, stehen sie senkrecht. Kommt was anderes raus, nicht.<div class="calc">3 · (−⅓) = −1 ✓ &nbsp;&nbsp; 2 · (−2) = −4 ✗</div>`],
[`Parallele durch einen Punkt P`,`m von der gegebenen Geraden übernehmen. Dann P einsetzen und t ausrechnen, wie bei „Gerade aus zwei Punkten“, Schritt 2 und 3.`],
[`Senkrechte durch einen Punkt P`,`Erst m₂ = −1 : m₁ bilden. Dann P einsetzen und t ausrechnen.`]],
merke:`<p><b>Parallel:</b> m₁ = m₂</p><p><b>Senkrecht:</b> m₂ = −${fr('1','m₁')} &nbsp; bzw. &nbsp; m₁ · m₂ = −1</p><p><mark>Umdrehen UND Vorzeichen wechseln. Beides!</mark></p>`,
bsp:[{q:`Bestimme die Parallele zu g: y = 2x − 1 durch P(3 | 4).`,s:[`Parallel → gleiche Steigung: m = 2.`,`P einsetzen: 4 = 2 · 3 + t, also 4 = 6 + t.`,`− 6 auf beiden Seiten: t = −2.`],r:`h: y = 2x − 2`},
{q:`Bestimme die Senkrechte zu g: y = ½x + 3 durch P(2 | 1).`,s:[`m₁ = ½. Umdrehen: 2. Vorzeichen wechseln: m₂ = −2.`,`Kontrolle: ½ · (−2) = −1 ✓`,`P einsetzen: 1 = −2 · 2 + t, also 1 = −4 + t.`,`+ 4 auf beiden Seiten: t = 5.`],r:`h: y = −2x + 5`},
{q:`Stehen g: y = ¾x + 1 und h: y = −${fr('4','3')}x − 2 senkrecht aufeinander?`,s:[`Steigungen malnehmen: ¾ · (−${fr('4','3')}).`,`Zähler mal Zähler, Nenner mal Nenner: −${fr('12','12')} = −1.`],r:`Ja, m₁ · m₂ = −1. Sie stehen senkrecht.`}],
fehler:[[`m₂ = ${fr('1','m₁')} (so steht es im Heft)`,`m₂ = −${fr('1','m₁')}`,`Ohne Minus sind die Geraden nicht senkrecht. Beispiel: 2 und ½ ergeben 2 · ½ = 1, nicht −1.`],
[`m₁ = 3 → m₂ = −3`,`m₂ = −⅓`,`Nur das Vorzeichen wechseln reicht nicht. Auch umdrehen.`],
[`m₁ = 3 → m₂ = ⅓`,`m₂ = −⅓`,`Nur umdrehen reicht auch nicht. Auch das Vorzeichen wechseln.`],
[`Parallel, weil gleiches t`,`Parallel nur bei gleichem m`,`Gleiches t heißt nur: Sie schneiden sich auf der y-Achse.`]],
quiz:[{l:1,q:`Welche Gerade ist parallel zu y = 4x + 1?`,o:[`y = −4x + 1`,`y = 4x − 6`,`y = ¼x + 1`,`y = x + 4`],a:1},
{l:1,q:`m₁ = 2. Welche Steigung hat die Senkrechte?`,o:[`−½`,`½`,`−2`,`2`],a:0},
{l:2,q:`m₁ = −⅓. m₂ der Senkrechten = ?`,a:3},
{l:2,q:`m₁ = ⅖. m₂ der Senkrechten = ? (Bruch oder Dezimalzahl)`,a:-2.5,s:'−5/2 = −2,5',h:`Umdrehen: 5/2. Vorzeichen wechseln.`},
{l:2,q:`Stehen y = 2x + 1 und y = −2x + 3 senkrecht?`,o:[`Ja`,`Nein`],a:1,h:`2 · (−2) = ?`},
{l:3,q:`Parallele zu y = −3x + 2 durch P(1 | 4). t = ?`,a:7,h:`4 = −3 · 1 + t`},
{l:3,q:`Senkrechte zu y = 2x durch P(4 | 0). t = ?`,a:2,h:`m₂ = −½. Dann 0 = −½ · 4 + t`},
{l:3,q:`Stehen y = −⅔x + 1 und y = 1,5x − 2 senkrecht?`,o:[`Ja`,`Nein`],a:0,h:`1,5 = ³⁄₂. Dann −⅔ · ³⁄₂ = ?`}]},

{id:'m-lin-verschiebung',t:'Geraden verschieben mit Vektor',kurz:'Punkt abbilden, Steigung bleibt gleich',tag:'Probe-Thema',probe:1,
intro:`<p>Ein Vektor ${vec('v<sub>x</sub>','v<sub>y</sub>')} ist eine Verschiebe-Anweisung. <b>Oben</b>: so viel nach rechts (negativ = links). <b>Unten</b>: so viel nach oben (negativ = unten).</p>
<p>Wird eine Gerade verschoben, <mark>bleibt die Steigung gleich</mark>. Die Gerade wird nur woanders hingelegt. Es genügt also, <b>einen Punkt</b> zu verschieben, am besten den Schnittpunkt mit der y-Achse.</p>`,
img:()=>koord({xmin:-3,xmax:4,ymin:-2,ymax:5,u:34,alt:'Gerade g: y = ½x wird um den Vektor (0|3) zu f: y = ½x + 3 verschoben',fns:[{f:x=>x/2,cls:'ln3'},{f:x=>x/2+3,cls:'ln1'}],
 extra:(X,Y)=>{const ar=(x1,y1,x2,y2)=>`<path d="M${X(x1)} ${Y(y1)}L${X(x2)} ${Y(y2)+8}" style="stroke:var(--red);stroke-width:2.5;fill:none"/><path d="M${X(x2)-6} ${Y(y2)+10}L${X(x2)} ${Y(y2)}L${X(x2)+6} ${Y(y2)+10}Z" style="fill:var(--red)"/>`;
 return ar(0,0,0,3)+ar(2,1,2,4)+`<text class="lbl" x="${X(0.15)}" y="${Y(1.6)}" style="fill:var(--red)">v→</text><text class="lbl" x="${X(2.3)}" y="${Y(4.6)}" style="fill:var(--blue)">f: y = ½x + 3</text><text class="lbl" x="${X(2.2)}" y="${Y(0.4)}" style="fill:var(--green)">g: y = ½x</text>`}}),
cap:'Beispiel aus deinem Heft: g wird um 3 nach oben verschoben. Jeder Punkt wandert gleich weit.',
steps:[
[`Vektor lesen`,`${vec('2','−1')} heißt: 2 nach rechts, 1 nach unten. ${vec('0','3')} heißt: 0 nach rechts, 3 nach oben.`],
[`Einen Punkt verschieben`,`Die Zahlen vom Vektor zum Punkt dazuzählen:<div class="calc">P(x | y) → P'(x + v<sub>x</sub> | y + v<sub>y</sub>)<br>P(1 | 2) mit ${vec('3','4')} → P'(4 | 6)</div>`],
[`Bei Geraden: m bleibt gleich`,`Die verschobene Gerade hat dieselbe Steigung. Du musst nur noch das neue t finden.`],
[`Den Punkt (0 | t) verschieben`,`Nimm den y-Achsenabschnitt der alten Geraden als Punkt und verschieb ihn mit dem Vektor. Das ist ein Punkt auf der neuen Geraden.`],
[`Neues t ausrechnen`,`Den verschobenen Punkt und das alte m in y = mx + t einsetzen, nach t auflösen. Wie bei „Gerade aus zwei Punkten“.`],
[`Abkürzung, wenn oben 0 steht`,`Ist der Vektor ${vec('0','a')}, geht es nur hoch oder runter. Dann ist das neue t einfach t + a.`]],
merke:`<p><b>Verschiebung mit ${vec('v<sub>x</sub>','v<sub>y</sub>')}:</b> P(x | y) → P'(x + v<sub>x</sub> | y + v<sub>y</sub>)</p><p><mark>Bei Geraden bleibt m gleich. Nur t ändert sich.</mark></p><p>Vektor ${vec('0','a')}: neues t = altes t + a</p>`,
bsp:[{q:`Aus deinem Heft: g: y = ½x wird mit v→ = ${vec('0','3')} verschoben. Wie heißt die neue Gerade f?`,s:[`m bleibt gleich: m = ½.`,`Oben steht 0, also nur nach oben verschoben. Altes t = 0, neues t = 0 + 3 = 3.`],r:`f: y = ½x + 3`},
{q:`g: y = 2x + 1 wird mit v→ = ${vec('2','−1')} verschoben. Wie heißt die neue Gerade?`,s:[`m bleibt: m = 2.`,`Punkt (0 | 1) von g verschieben: (0 + 2 | 1 − 1) = (2 | 0).`,`(2 | 0) in y = 2x + t einsetzen: 0 = 2 · 2 + t, also 0 = 4 + t.`,`t = −4.`,`Probe mit einem anderen Punkt von g: (1 | 3) → (3 | 2). 2 · 3 − 4 = 2 ✓`],r:`y = 2x − 4`},
{q:`Fangfrage: g: y = ½x wird mit v→ = ${vec('2','1')} verschoben. Was passiert?`,s:[`m bleibt ½.`,`Punkt (0 | 0) verschieben: (2 | 1).`,`Einsetzen: 1 = ½ · 2 + t, also 1 = 1 + t, t = 0.`,`Die neue Gerade ist y = ½x, also dieselbe wie vorher! Der Vektor zeigt genau in Richtung der Geraden (2 rechts, 1 hoch = Steigung ½). Die Gerade rutscht nur in sich selbst.`],r:`y = ½x (unverändert)`}],
fehler:[[`Bei Verschiebung ändert sich m`,`m bleibt immer gleich`,`Verschieben heißt nicht drehen.`],
[`${vec('3','0')}: neues t = t + 3`,`Punkt verschieben und neu einsetzen`,`Die obere Zahl ist nach rechts. Das ändert t nicht einfach um 3.`],
[`Oben und unten vertauschen`,`Oben = x (rechts/links), unten = y (hoch/runter)`,`Wie bei Punkten: erst x, dann y.`]],
quiz:[{l:1,q:`P(1 | 2) wird mit ${vec('3','4')} verschoben. x-Wert von P'?`,a:4},{l:1,q:`Und der y-Wert von P'?`,a:6},
{l:1,q:`y = 5x − 2 wird verschoben. Welche Steigung hat die neue Gerade?`,a:5},
{l:2,q:`g: y = −x + 2 wird mit ${vec('0','−5')} verschoben. Neues t?`,a:-3},
{l:3,q:`g: y = 3x wird mit ${vec('1','0')} verschoben. Neues t?`,a:-3,h:`(0 | 0) → (1 | 0). Dann 0 = 3 · 1 + t`},
{l:3,q:`g: y = 2x + 1 wird mit ${vec('−1','2')} verschoben. Neues t?`,a:5,h:`(0 | 1) → (−1 | 3). Dann 3 = 2 · (−1) + t`}]},

{id:'m-lin-text',t:'Textaufgaben mit linearen Funktionen',kurz:'Aus dem Text die Gleichung machen: ein fester Plan',tag:'Probe-Thema',probe:1,
intro:`<p>Bei Textaufgaben ist das Rechnen meistens leicht. Schwer ist, <b>aus dem Text die Gleichung</b> zu machen. Dafür gibt es einen festen Plan, den du jedes Mal gleich abarbeitest.</p>
<p>Fast jede Textaufgabe hat einen <b>festen Betrag</b> (das ist t) und etwas, das <b>pro Stück, pro Minute, pro km</b> dazukommt oder weggeht (das ist m).</p>
<div class="tbl"><table class="t"><tr><th>Signalwörter im Text</th><th>wird zu</th></tr>
<tr><td>Grundgebühr, Startgebühr, Anfahrt, am Anfang, schon, bereits</td><td><b>t</b></td></tr>
<tr><td>pro, je, jede, für jede Minute, in jeder Stunde</td><td><b>m</b></td></tr>
<tr><td>nimmt ab, sinkt, verbraucht, wird abgelassen, brennt ab</td><td><b>m negativ</b></td></tr></table></div>`,
steps:[
[`Zweimal lesen, Frage unterstreichen`,`Erst ganz lesen. Beim zweiten Mal die eigentliche Frage unterstreichen. Was willst du am Ende wissen?`],
[`Zahlen mit Einheit markieren`,`Fester Betrag in einer Farbe (t), Betrag „pro …“ in einer anderen Farbe (m). Wird etwas weniger? Dann Minus vor m.`],
[`x und y in Worten festlegen`,`Schreib hin: <b>x = Anzahl der Minuten</b>, <b>y = Kosten in €</b>. Das verhindert Verwechslungen.`],
[`Gleichung aufstellen`,`y = m · x + t mit deinen Zahlen.`],
[`Was ist gesucht: x oder y?`,`Ist y gesucht (z. B. Kosten), setzt du x ein und rechnest aus. Ist x gesucht (z. B. wie viele Minuten), setzt du y ein und löst nach x auf.`],
[`Antwortsatz und Check`,`Ganzer Satz mit Einheit. Dann fragen: Ist das realistisch? Eine Kerze, die 300 Stunden brennt, oder ein Taxi für 2 000 €, da stimmt was nicht.`]],
merke:`<p><b>Fester Betrag → t. &nbsp; Pro-Betrag → m. &nbsp; Weniger werden → m negativ.</b></p><p><mark>Immer: x und y in Worten festlegen, am Ende Antwortsatz mit Einheit.</mark></p>`,
bsp:[{q:`Eine Kerze ist 24 cm hoch. Pro Stunde brennt sie 1,5 cm ab. Nach wie vielen Stunden ist sie abgebrannt?`,s:[`Festlegen: x = Stunden, y = Höhe der Kerze in cm.`,`Am Anfang 24 cm → t = 24. Pro Stunde 1,5 cm weniger → m = −1,5.`,`Gleichung: y = −1,5x + 24.`,`„Abgebrannt“ heißt Höhe 0. Also y = 0 einsetzen: 0 = −1,5x + 24.`,`+ 1,5x auf beiden Seiten: 1,5x = 24. Durch 1,5: x = 16.`],r:`Die Kerze ist nach 16 Stunden abgebrannt.`},
{q:`Fitnessstudio A: 20 € Aufnahmegebühr und 30 € pro Monat. Studio B: keine Aufnahmegebühr, 35 € pro Monat. Nach wie vielen Monaten kosten beide gleich viel?`,s:[`x = Monate, y = Gesamtkosten in €.`,`A: y = 30x + 20. &nbsp; B: y = 35x.`,`Gleich teuer heißt: gleichsetzen. 30x + 20 = 35x.`,`− 30x auf beiden Seiten: 20 = 5x. Durch 5: x = 4.`,`Check: A: 30 · 4 + 20 = 140 €. B: 35 · 4 = 140 €. ✓`],r:`Nach 4 Monaten zahlt man bei beiden 140 €. Danach ist A günstiger.`},
{q:`Ein Handwerker berechnet für 2 Stunden 130 € und für 5 Stunden 280 €. Wie viel kostet eine Stunde, und wie hoch ist die Anfahrt?`,s:[`x = Stunden, y = Preis in €. Das sind zwei Punkte: A(2 | 130) und B(5 | 280).`,`m = ${fr('280 − 130','5 − 2')} = ${fr('150','3')} = 50. Das ist der Preis pro Stunde.`,`A einsetzen: 130 = 50 · 2 + t, also 130 = 100 + t, t = 30. Das ist die Anfahrt.`,`Gleichung: y = 50x + 30.`],r:`Eine Stunde kostet 50 €, die Anfahrt 30 €.`}],
fehler:[[`Taxi 3 € Grundgebühr, 2 € pro km: y = 3x + 2`,`y = 2x + 3`,`Das „pro km“ gehört zum x. Der feste Betrag steht allein.`],
[`Nur „16“ als Antwort`,`„Nach 16 Stunden ist die Kerze abgebrannt.“`,`Ohne Antwortsatz und Einheit gibt es oft Punktabzug.`],
[`Minuten und Stunden mischen`,`Alles in dieselbe Einheit umrechnen`,`Steht der Preis pro Stunde, aber die Zeit in Minuten, erst umrechnen: 30 min = 0,5 h.`]],
quiz:[{l:1,q:`Ein Taxi kostet 3,50 € Grundgebühr und 2 € pro km. Wie groß ist t?`,a:3.5},{l:1,q:`Und wie groß ist m?`,a:2},
{l:2,q:`Ein Becken mit 500 Litern wird abgelassen, 20 Liter pro Minute. Welche Gleichung stimmt? (x = Minuten, y = Liter)`,o:[`y = 20x + 500`,`y = −20x + 500`,`y = 500x − 20`,`y = −500x + 20`],a:1},
{l:2,q:`Nach wie vielen Minuten ist das Becken leer?`,a:25,h:`0 = −20x + 500`},
{l:3,q:`Stromtarif A: 10 € + 0,30 € pro kWh. Tarif B: 16 € + 0,25 € pro kWh. Bei wie vielen kWh kosten beide gleich viel?`,a:120,h:`0,30x + 10 = 0,25x + 16`},
{l:3,q:`Handwerker: 3 Stunden kosten 150 €, 6 Stunden kosten 270 €. Wie hoch ist die Anfahrt in €?`,a:30,h:`m = 120 : 3 = 40. Dann 150 = 40 · 3 + t`}]},
