{id:'m-wurzeln',t:'Wurzeln und reelle Zahlen',kurz:'Was √ bedeutet, Wurzeln vereinfachen, mit Wurzeln rechnen',tag:'alle Zweige',
intro:`<p>Die Wurzel ist die <mark>Umkehrung vom Quadrieren</mark>. Quadrieren heißt: eine Zahl mal sich selbst. 5² = 5 · 5 = 25.</p><p>Die Wurzel fragt rückwärts: <b>Welche Zahl mal sich selbst ergibt 25?</b> Antwort: 5. Also ist √25 = 5.</p><p>Stell dir ein Quadrat vor. Die Fläche kennst du, die Seite suchst du. Die Seite ist die Wurzel aus der Fläche.</p>`,
img:'quadrat',cap:'Ein Quadrat mit 25 Kästchen hat die Seitenlänge 5.',
steps:[
['Quadratzahlen auswendig können','Ohne die geht es nicht. 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144, 169, 196, 225. Schreib sie dir auf einen Zettel neben den Schreibtisch.'],
['Wurzel aus einer Quadratzahl','Frag dich: Welche Zahl mal sich selbst gibt das? √81: 9 · 9 = 81, also <span class="f">√81 = 9</span>.'],
['Unter der Wurzel darf nichts Negatives stehen','√(−9) gibt es bei uns nicht. Keine Zahl mal sich selbst ergibt etwas Negatives, denn (−3) · (−3) = +9.'],
['Wurzel teilweise ziehen (vereinfachen)','Zerlege die Zahl in <b>Quadratzahl · Rest</b>. Nimm die größte Quadratzahl, die passt. Dann ziehst du nur aus der Quadratzahl die Wurzel.<div class="calc">√72 = √(36 · 2) = √36 · √2 = 6√2</div>'],
['Wurzeln malnehmen und teilen','Du darfst zusammenfassen: <span class="f">√a · √b = √(a · b)</span> und <span class="f">√a : √b = √(a : b)</span>.<div class="calc">√2 · √8 = √16 = 4<br>√50 : √2 = √25 = 5</div>'],
['Wurzeln addieren','Nur <b>gleiche</b> Wurzeln kann man zusammenzählen, wie bei Äpfeln: 3 Äpfel + 5 Äpfel = 8 Äpfel.<div class="calc">3√2 + 5√2 = 8√2<br>√8 + √18 = 2√2 + 3√2 = 5√2</div>'],
['Nenner rational machen','Im Nenner soll keine Wurzel stehen. Erweitere den Bruch mit der Wurzel aus dem Nenner. Weil √3 · √3 = 3, verschwindet die Wurzel unten.<div class="calc">6/√3 = (6 · √3)/(√3 · √3) = 6√3/3 = 2√3</div>']],
merke:`<p><b>√a</b> ist die Zahl, die mit sich selbst multipliziert <b>a</b> ergibt. Sie ist nie negativ.</p><p>√a · √b = √(a·b) &nbsp;&nbsp; √a : √b = √(a:b)</p><p><mark>Aber: √(a + b) ist NICHT √a + √b!</mark></p><p>Zahlen wie √2 oder π kann man nicht als Bruch schreiben. Sie heißen <b>irrational</b>. Alle Brüche und alle irrationalen Zahlen zusammen sind die <b>reellen Zahlen ℝ</b>.</p>`,
img2:'mengen',cap2:'Jede Menge steckt in der nächstgrößeren.',
bsp:[{q:'Vereinfache √75 + √12.',s:['Suche in 75 die größte Quadratzahl: 75 = 25 · 3.','Also √75 = √25 · √3 = 5√3.','Suche in 12 die größte Quadratzahl: 12 = 4 · 3.','Also √12 = √4 · √3 = 2√3.','Jetzt sind es gleiche Wurzeln (√3). Zusammenzählen: 5√3 + 2√3.'],r:'Ergebnis: 7√3'},
{q:'Mach den Nenner rational: 10/√5',s:['Mit √5 erweitern, oben und unten: (10 · √5)/(√5 · √5).','Unten: √5 · √5 = 5. Also 10√5/5.','Kürzen: 10 : 5 = 2.'],r:'Ergebnis: 2√5'}],
fehler:[['√(9 + 16) = 3 + 4 = 7','√(9 + 16) = √25 = 5','Erst unter der Wurzel ausrechnen, dann die Wurzel ziehen. Bei Plus darfst du nicht aufteilen.'],
['2√3 + 3√2 = 5√5','Geht nicht weiter zusammenzufassen','√3 und √2 sind verschiedene „Sorten“. Wie Äpfel und Birnen.'],
['√72 = √(9 · 8) = 3√8','√72 = √(36 · 2) = 6√2','3√8 ist nicht falsch, aber nicht fertig. Immer die größte Quadratzahl nehmen.']],
quiz:[{q:'√144 = ?',a:12},{q:'√0,25 = ?',a:0.5,h:'0,5 · 0,5 = ?'},
{q:'Welche Vereinfachung von √50 ist richtig?',o:['25√2','5√2','2√5','5√10'],a:1,h:'50 = 25 · 2'},
{q:'√12 · √3 = ?',a:6,h:'Zusammenfassen: √(12 · 3)'},
{q:'Was ist 6/√2 mit rationalem Nenner?',o:['3√2','6√2','√3','3'],a:0,h:'Mit √2 erweitern: 6√2/2'},
{q:'√27 + √12 = ?',o:['√39','5√3','6√3','13√3'],a:1,h:'√27 = 3√3 und √12 = 2√3'}]},

{id:'m-streckung',t:'Zentrische Streckung und Strahlensätze',kurz:'Figuren vergrößern, fehlende Längen mit Verhältnissen berechnen',tag:'alle Zweige',
intro:`<p>Bei der <b>zentrischen Streckung</b> vergrößerst oder verkleinerst du eine Figur von einem Punkt Z aus. Das ist wie ein Beamer: Je weiter weg die Wand, desto größer das Bild.</p><p>Der <b>Streckungsfaktor k</b> sagt, wie viel größer. k = 2 heißt: alles doppelt so lang. k = 0,5 heißt: alles halb so lang.</p>`,
img:'streck',cap:'Dreieck ABC wird von Z aus mit k = 2 gestreckt.',
steps:[
['Strahl von Z durch den Punkt zeichnen','Für jeden Eckpunkt: Lineal an Z und an den Punkt, Strahl verlängern.'],
['Abstand messen und mal k nehmen','Ist ZA = 3 cm und k = 2, dann ist ZA\' = 2 · 3 cm = 6 cm. Den Bildpunkt A\' trägst du auf dem Strahl ab.'],
['Bildpunkte verbinden','A\', B\', C\' verbinden. Das Bild hat die <b>gleichen Winkel</b> wie das Original.'],
['Längen und Flächen umrechnen','Jede Strecke wird k-mal so lang. Die Fläche wird aber <mark>k²-mal</mark> so groß. Bei k = 2 also 4-mal so groß.'],
['Strahlensatz-Figur erkennen','Zwei Strahlen gehen von Z aus. Zwei <b>parallele</b> Linien schneiden beide Strahlen. Dann gelten die Strahlensätze.'],
['Verhältnis aufstellen und ausrechnen','Schreib immer „klein durch groß = klein durch groß“, mit den passenden Strecken. Dann nach der Unbekannten auflösen.']],
merke:`<p><b>Länge im Bild = k · Länge im Original</b> &nbsp; <b>Fläche im Bild = k² · Fläche im Original</b></p><p><b>1. Strahlensatz:</b> ZA : ZA' = ZB : ZB' &nbsp;(Abschnitte auf den Strahlen)</p><p><b>2. Strahlensatz:</b> ZA : ZA' = AB : A'B' &nbsp;(<mark>Parallelen immer ab Z messen!</mark>)</p>`,
img2:'strahl',cap2:'Die rote und die blaue Linie sind parallel.',
bsp:[{q:'In der Figur oben ist ZA = 4, AA\' = 2 und AB = 3. Wie lang ist A\'B\'?',s:['Erst ZA\' ausrechnen: ZA\' = ZA + AA\' = 4 + 2 = 6.','2. Strahlensatz, weil eine Parallele gesucht ist: AB : A\'B\' = ZA : ZA\'.','Einsetzen: 3 : A\'B\' = 4 : 6.','Umstellen: A\'B\' = 3 · 6 : 4 = 18 : 4.'],r:'A\'B\' = 4,5'},
{q:'Ein 2 m langer Stab wirft einen 3 m langen Schatten. Ein Baum wirft zur gleichen Zeit einen 12 m langen Schatten. Wie hoch ist der Baum?',s:['Sonnenstrahlen sind parallel, Stab und Baum stehen beide senkrecht. Das ist eine Strahlensatz-Figur.','Verhältnis: Höhe : Schatten ist bei beiden gleich. 2 : 3 = h : 12.','Umstellen: h = 2 · 12 : 3 = 24 : 3.'],r:'Der Baum ist 8 m hoch.'}],
fehler:[['AB : A\'B\' = AA\' : ZA\'','AB : A\'B\' = ZA : ZA\'','Beim 2. Strahlensatz immer die ganzen Strecken ab Z nehmen, nicht nur das Stück dazwischen.'],
['k = 3, Fläche wird 3-mal so groß','Fläche wird 3² = 9-mal so groß','Länge und Breite werden beide 3-mal so groß. 3 · 3 = 9.']],
quiz:[{q:'Ein Dreieck wird mit k = 3 gestreckt. Eine Seite ist 4 cm lang. Wie lang ist sie im Bild (in cm)?',a:12},
{q:'Ein Rechteck hat 5 cm² Fläche. Es wird mit k = 2 gestreckt. Neue Fläche in cm²?',a:20,h:'Fläche mal k², also mal 4.'},
{q:'ZA = 5, ZA\' = 10, AB = 4. Wie lang ist A\'B\'?',a:8,h:'AB : A\'B\' = ZA : ZA\''},
{q:'Was bedeutet k = 0,5?',o:['Die Figur wird doppelt so groß','Die Figur wird halb so groß (Längen)','Die Figur wird gespiegelt','Nichts ändert sich'],a:1}]},

{id:'m-pythagoras',t:'Satz des Pythagoras',kurz:'Fehlende Seite im rechtwinkligen Dreieck berechnen',tag:'alle Zweige',
intro:`<p>Er gilt <mark>nur im rechtwinkligen Dreieck</mark> (ein Winkel ist 90°).</p><p>Die längste Seite liegt gegenüber vom rechten Winkel. Sie heißt <b>Hypotenuse</b> und meistens <b>c</b>. Die beiden kürzeren Seiten am rechten Winkel heißen <b>Katheten</b> (a und b).</p><p>Baut man auf jede Seite ein Quadrat, dann passen die beiden kleinen Quadrate zusammen genau in das große.</p>`,
img:'pyth',cap:'3² + 4² = 5², also 9 + 16 = 25.',
steps:[
['Rechten Winkel finden','Wo ist das Kästchen mit dem Punkt? Die Seite gegenüber ist die Hypotenuse c. Markier sie farbig.'],
['Formel hinschreiben','<span class="f">a² + b² = c²</span>. Schreib sie jedes Mal hin, auch wenn du sie kennst.'],
['Fall 1: Hypotenuse gesucht','Beide Katheten quadrieren, addieren, Wurzel ziehen.<div class="calc">c = √(a² + b²)</div>'],
['Fall 2: Kathete gesucht','Großes Quadrat <b>minus</b> kleines Quadrat, dann Wurzel ziehen.<div class="calc">b = √(c² − a²)</div>'],
['Ergebnis prüfen','Die Hypotenuse muss die längste Seite sein. Ist deine Kathete länger als c, hast du falsch gerechnet.']],
merke:`<p>Im rechtwinkligen Dreieck gilt: <b>Kathete² + Kathete² = Hypotenuse²</b></p><p><mark>Hypotenuse gesucht: plus. Kathete gesucht: minus.</mark></p>`,
bsp:[{q:'Ein rechtwinkliges Dreieck hat die Hypotenuse c = 13 cm und die Kathete a = 5 cm. Berechne b.',s:['Gesucht ist eine Kathete, also wird minus gerechnet.','b² = c² − a² = 13² − 5²','b² = 169 − 25 = 144','b = √144'],r:'b = 12 cm'},
{q:'Eine 5 m lange Leiter lehnt an einer Wand. Unten steht sie 1,40 m von der Wand weg. Wie hoch reicht sie?',s:['Skizze: Wand, Boden und Leiter bilden ein rechtwinkliges Dreieck. Der rechte Winkel ist zwischen Wand und Boden.','Die Leiter liegt gegenüber vom rechten Winkel, sie ist die Hypotenuse: c = 5 m.','Gesucht ist die Höhe an der Wand, eine Kathete: h² = 5² − 1,4²','h² = 25 − 1,96 = 23,04','h = √23,04'],r:'h = 4,8 m'}],
fehler:[['b² = 5² + 13²','b² = 13² − 5²','Wenn eine Kathete gesucht ist, wird subtrahiert.'],
['c = 3 + 4 = 7','c = √(9 + 16) = 5','Erst quadrieren, dann addieren, dann Wurzel. Nicht einfach die Seiten addieren.'],
['Pythagoras im beliebigen Dreieck','Nur mit rechtem Winkel','Ohne 90° gilt der Satz nicht. Manchmal musst du dir erst ein rechtwinkliges Dreieck einzeichnen.']],
quiz:[{q:'a = 6 cm, b = 8 cm. Wie lang ist die Hypotenuse c (in cm)?',a:10},
{q:'c = 10 cm, a = 6 cm. Wie lang ist b (in cm)?',a:8,h:'b² = 100 − 36'},
{q:'Ein Rechteck ist 12 cm lang und 5 cm breit. Wie lang ist die Diagonale (in cm)?',a:13,h:'Die Diagonale ist die Hypotenuse.'},
{q:'Welche Seite ist die Hypotenuse?',o:['Die kürzeste Seite','Die Seite gegenüber vom rechten Winkel','Die Seite unten','Die Seite am rechten Winkel'],a:1}]},

{id:'m-trigo',t:'Sinus, Kosinus, Tangens',kurz:'Seiten und Winkel im rechtwinkligen Dreieck',tag:'alle Zweige',
intro:`<p>Mit Pythagoras brauchst du zwei Seiten, um die dritte zu finden. Mit <b>sin, cos und tan</b> reichen <b>eine Seite und ein Winkel</b>. Oder du findest einen Winkel aus zwei Seiten.</p><p>Wichtig: Die Namen der Katheten hängen davon ab, <mark>von welchem Winkel du schaust</mark>.</p>`,
img:'trig',cap:'Gegenkathete liegt gegenüber von α, Ankathete liegt an α.',
steps:[
['Rechten Winkel und Hypotenuse markieren','Die Hypotenuse liegt immer gegenüber vom 90°-Winkel.'],
['Vom Winkel α aus schauen','Die Kathete, die α berührt, ist die <b>Ankathete</b>. Die andere ist die <b>Gegenkathete</b>.'],
['Passende Formel wählen','Merksatz: <b>GAGA HühnerHof AG</b><div class="calc">sin α = <u>G</u>egenkathete : <u>H</u>ypotenuse<br>cos α = <u>A</u>nkathete : <u>H</u>ypotenuse<br>tan α = <u>G</u>egenkathete : <u>A</u>nkathete</div>Nimm die Formel, in der die bekannte und die gesuchte Größe vorkommen.'],
['Einsetzen und umstellen','Ist eine Seite gesucht, stellst du um. Ist ein Winkel gesucht, nimmst du am Taschenrechner sin⁻¹, cos⁻¹ oder tan⁻¹ (meist mit SHIFT).'],
['Taschenrechner auf DEG','Prüf, dass oben „D“ oder „DEG“ steht. Sonst rechnet er im falschen Winkelmaß.']],
merke:`<p><b>sin α = G : H</b> &nbsp; <b>cos α = A : H</b> &nbsp; <b>tan α = G : A</b></p><p><mark>Funktioniert nur im rechtwinkligen Dreieck.</mark></p>`,
bsp:[{q:'Hypotenuse = 10 cm, α = 30°. Wie lang ist die Gegenkathete?',s:['Bekannt: Hypotenuse und Winkel. Gesucht: Gegenkathete. G und H, also Sinus.','sin 30° = G : 10','Umstellen (mal 10): G = 10 · sin 30°','Taschenrechner: sin 30° = 0,5. Also G = 10 · 0,5.'],r:'Gegenkathete = 5 cm'},
{q:'Gegenkathete = 3 cm, Ankathete = 4 cm. Wie groß ist α?',s:['G und A bekannt, also Tangens.','tan α = 3 : 4 = 0,75','Winkel gesucht: α = tan⁻¹(0,75)','Taschenrechner: SHIFT, tan, 0,75.'],r:'α ≈ 36,9°'}],
fehler:[['Gegenkathete von α = Seite an α','Gegenkathete liegt gegenüber von α','Immer zuerst den Winkel markieren, dann benennen.'],
['α = 0,75','α = tan⁻¹(0,75) ≈ 36,9°','0,75 ist der Tangenswert, nicht der Winkel. Du brauchst die Umkehrtaste.']],
quiz:[{q:'Hypotenuse 8 cm, α = 30°. Gegenkathete in cm?',a:4,h:'G = 8 · sin 30° = 8 · 0,5'},
{q:'Welche Formel brauchst du, wenn Ankathete und Hypotenuse bekannt sind?',o:['sin','cos','tan','Pythagoras geht nicht'],a:1},
{q:'Gegenkathete = Ankathete = 5 cm. Wie groß ist α in Grad?',a:45,h:'tan α = 5 : 5 = 1'}]},

{id:'m-lgs',t:'Lineare Gleichungssysteme',kurz:'Zwei Gleichungen, zwei Unbekannte: Gleichsetzen, Einsetzen, Addieren',tag:'alle Zweige',
intro:`<p>Du hast <b>zwei Gleichungen</b> mit <b>zwei Unbekannten</b> (x und y). Gesucht ist das Zahlenpaar, das <mark>beide</mark> Gleichungen gleichzeitig erfüllt.</p><p>Im Koordinatensystem ist jede Gleichung eine Gerade. Die Lösung ist der <b>Schnittpunkt</b>.</p>`,
img:()=>koord({xmin:-1,xmax:7,ymin:-1,ymax:8,u:30,alt:'Zwei Geraden schneiden sich im Punkt (2|5)',fns:[{f:x=>2*x+1,cls:'ln1'},{f:x=>-x+7,cls:'ln2'}],
 pts:[{x:2,y:5,cls:'dot',l:'S(2|5)',dx:10,dy:-6}],extra:(X,Y)=>`<text class="lbl" x="${X(3)+6}" y="${Y(7)+4}" style="fill:var(--blue)">y = 2x + 1</text><text class="lbl" x="${X(5)}" y="${Y(2)-8}" style="fill:var(--red)">y = −x + 7</text>`}),cap:'Die Lösung ist der Schnittpunkt der beiden Geraden.',
steps:[
['Gleichungen nummerieren','Schreib I und II davor. So weißt du immer, mit welcher du arbeitest.'],
['Verfahren wählen','Stehen beide schon als „y = …“ da: <b>Gleichsetzen</b>. Steht eine als „y = …“ oder „x = …“ da: <b>Einsetzen</b>. Haben beide eine Zahl vor x oder y, die sich wegheben lässt (z. B. +3y und −3y): <b>Addieren</b>.'],
['Eine Unbekannte rauswerfen','Nach dem Verfahren hast du nur noch eine Gleichung mit einer Unbekannten. Die löst du ganz normal.'],
['Zweite Unbekannte ausrechnen','Das Ergebnis in eine der beiden Anfangsgleichungen einsetzen.'],
['Probe in beiden Gleichungen','Stimmt es in I <b>und</b> II? Erst dann ist es richtig.'],
['Lösungsmenge hinschreiben','L = {(x|y)}, zum Beispiel L = {(2|5)}.']],
merke:`<p><b>Gleichsetzen:</b> y = … und y = … → rechte Seiten gleichsetzen.</p><p><b>Einsetzen:</b> y = … in die andere Gleichung einsetzen.</p><p><b>Addieren:</b> Gleichungen so malnehmen, dass x oder y beim Addieren wegfällt.</p><p><mark>Parallele Geraden: keine Lösung. Gleiche Gerade: unendlich viele Lösungen.</mark></p>`,
bsp:[{q:'Gleichsetzen: I: y = 2x + 1 und II: y = −x + 7',s:['Beide Gleichungen fangen mit y = an. Also rechte Seiten gleichsetzen: 2x + 1 = −x + 7.','+x auf beiden Seiten: 3x + 1 = 7.','−1: 3x = 6. Durch 3: x = 2.','x = 2 in I einsetzen: y = 2 · 2 + 1 = 5.','Probe in II: −2 + 7 = 5. Stimmt.'],r:'L = {(2|5)}'},
{q:'Addieren: I: 2x + 3y = 12 und II: 4x − 3y = 6',s:['+3y und −3y heben sich beim Addieren weg.','I + II: 2x + 4x + 3y − 3y = 12 + 6, also 6x = 18.','x = 3.','In I einsetzen: 2 · 3 + 3y = 12, also 6 + 3y = 12, 3y = 6, y = 2.','Probe in II: 4 · 3 − 3 · 2 = 12 − 6 = 6. Stimmt.'],r:'L = {(3|2)}'},
{q:'Textaufgabe: 3 Erwachsene und 2 Kinder zahlen im Kino 41 €. 1 Erwachsener und 2 Kinder zahlen 23 €. Was kostet ein Ticket?',s:['Unbekannte festlegen: e = Preis Erwachsener, k = Preis Kind.','I: 3e + 2k = 41 und II: e + 2k = 23.','I − II: 3e − e + 2k − 2k = 41 − 23, also 2e = 18, e = 9.','In II: 9 + 2k = 23, 2k = 14, k = 7.','Probe in I: 27 + 14 = 41. Stimmt.'],r:'Erwachsene 9 €, Kinder 7 €.'}],
fehler:[['Nur x ausrechnen und aufhören','x und y angeben','Die Lösung ist immer ein Paar.'],
['I + II, aber Vorzeichen vergessen: 3y + (−3y) = 6y','3y + (−3y) = 0','Plus und Minus heben sich auf. Schreib die Vorzeichen immer mit.'],
['Probe nur in einer Gleichung','Probe in beiden','Eine falsche Lösung kann zufällig in einer Gleichung passen.']],
quiz:[{q:'I: y = x + 2, II: y = −x + 6. Wie groß ist x?',a:2,h:'x + 2 = −x + 6'},{q:'Und wie groß ist y?',a:4},
{q:'I: x + y = 10, II: x − y = 2. Wie groß ist x?',a:6,h:'Addiere I und II: 2x = 12'},
{q:'Zwei Geraden haben die gleiche Steigung, aber verschiedene t. Wie viele Lösungen?',o:['Genau eine','Keine','Unendlich viele','Zwei'],a:1}]},

{id:'m-zufall',t:'Daten und Zufall',kurz:'Baumdiagramm, Pfadregeln, Wahrscheinlichkeit',tag:'alle Zweige',
intro:`<p>Bei Zufallsversuchen weißt du nicht vorher, was passiert. Aber du kannst sagen, wie <b>wahrscheinlich</b> etwas ist.</p><p>Bei mehreren Schritten hintereinander hilft das <b>Baumdiagramm</b>. Jeder Ast ist eine Möglichkeit.</p>`,
img:'baum',cap:'Urne mit 3 roten und 2 blauen Kugeln. Zweimal ziehen, ohne Zurücklegen.',
steps:[
['Erste Stufe zeichnen','Welche Ergebnisse gibt es beim ersten Zug? An jeden Ast die Wahrscheinlichkeit schreiben. Alle Äste an einem Punkt ergeben zusammen 1.'],
['Zweite Stufe zeichnen','Ohne Zurücklegen ändert sich der Inhalt der Urne! Nach einer roten Kugel sind nur noch 2 rote und 2 blaue drin.'],
['1. Pfadregel: entlang malnehmen','Wahrscheinlichkeit für einen Weg = alle Zahlen auf dem Weg malnehmen.'],
['2. Pfadregel: Wege addieren','Gehören mehrere Wege zum Ereignis, addierst du ihre Ergebnisse.']],
merke:`<p><b>Entlang eines Pfades: multiplizieren.</b></p><p><b>Mehrere Pfade: addieren.</b></p><p><mark>Ohne Zurücklegen: Nenner wird beim 2. Zug um 1 kleiner.</mark></p>`,
bsp:[{q:'Wie wahrscheinlich ist es, genau eine rote und eine blaue Kugel zu ziehen (Urne oben)?',s:['Zwei Wege passen: rot-blau und blau-rot.','rot-blau: 3/5 · 2/4 = 6/20','blau-rot: 2/5 · 3/4 = 6/20','Addieren: 6/20 + 6/20 = 12/20, gekürzt 3/5.'],r:'P = 3/5 = 60 %'}],
fehler:[['Ohne Zurücklegen: 3/5 · 3/5','3/5 · 2/4','Eine rote Kugel fehlt jetzt, und insgesamt sind nur noch 4 Kugeln drin.']],
quiz:[{q:'Eine Münze wird zweimal geworfen. P(zweimal Kopf) als Dezimalzahl?',a:0.25,h:'1/2 · 1/2'},
{q:'Urne oben: P(blau, blau) als Bruch?',o:['1/10','4/25','1/5','2/9'],a:0,h:'2/5 · 1/4'}]}
]},

deutsch:{name:'Deutsch',c:'var(--s-deutsch)',desc:'Erörterung, Bewerbung, indirekte Rede, Kommas',topics:[
{id:'d-eroerterung',t:'Erörterung schreiben',kurz:'Argumentieren mit Behauptung, Begründung, Beispiel',tag:'Klasse 9',
intro:`<p>In einer Erörterung denkst du über eine Frage nach und kommst zu einer begründeten Meinung. Zum Beispiel: <i>„Sollen Handys an Schulen verboten werden?“</i></p><p><b>Linear</b> (steigernd): Du sammelst Argumente für eine Seite. <b>Dialektisch</b> (Pro und Contra): Du wägst beide Seiten ab.</p>`,
img:'erorterung',cap:'Im Hauptteil kommt das stärkste Argument zum Schluss.',
steps:[
['Frage genau lesen','Unterstreiche das Thema. Ist es eine Entscheidungsfrage (ja/nein, dann meist dialektisch) oder eine Frage nach Gründen (linear)?'],
['Stoffsammlung','Schreib 5 Minuten lang alles auf, was dir einfällt. Ordne dann in Pro und Contra.'],
['Argumente nach 3B bauen','<b>Behauptung:</b> Handys lenken im Unterricht ab. <b>Begründung:</b> Nachrichten und Spiele ziehen die Aufmerksamkeit weg. <b>Beispiel:</b> Wer während der Stunde chattet, verpasst die Erklärung.'],
['Reihenfolge festlegen','Schwächstes Argument zuerst, stärkstes zuletzt. Das letzte bleibt im Kopf.'],
['Einleitung und Schluss','Einleitung: aktueller Anlass + Frage. Schluss: deine Meinung, kurz begründet, ein Ausblick oder Kompromiss.'],
['Überleitungen benutzen','„Ein weiterer Grund ist …“, „Noch wichtiger ist …“, „Dagegen spricht …“, „Abschließend …“']],
merke:`<p><b>Argument = Behauptung + Begründung + Beispiel</b></p><p><mark>Im Hauptteil steigern: wichtigstes Argument zuletzt.</mark></p>`,
bsp:[],fehler:[['Nur Behauptungen aneinanderreihen','Jede Behauptung begründen und mit Beispiel belegen','Ohne Begründung ist es nur eine Meinung, kein Argument.'],['„Ich finde das gut, weil es gut ist.“','Eine echte Begründung nennen','Das ist ein Zirkelschluss.']],
quiz:[{q:'Was gehört NICHT zu einem vollständigen Argument?',o:['Behauptung','Begründung','Beispiel','Überschrift'],a:3},
{q:'Wo steht das stärkste Argument?',o:['Am Anfang','In der Mitte','Am Ende des Hauptteils','In der Einleitung'],a:2}]},
{id:'d-bewerbung',t:'Bewerbung und Lebenslauf',kurz:'Anschreiben für Praktikum oder Ausbildung',tag:'Klasse 9',
intro:`<p>In der 9. Klasse schreibst du Bewerbungen für Praktikum oder Ausbildung. Eine Bewerbung besteht aus <b>Anschreiben</b>, <b>Lebenslauf</b> und <b>Zeugniskopie</b>.</p>`,
steps:[['Kopf','Oben links deine Adresse, darunter die Firma mit Ansprechpartner. Rechts das Datum.'],['Betreff','Fett, ohne das Wort „Betreff“: <i>Bewerbung um einen Praktikumsplatz als Mechatroniker</i>.'],['Anrede','Wenn möglich mit Namen: „Sehr geehrte Frau Yilmaz,“ Danach klein weiterschreiben.'],['Einleitung','Warum schreibst du? Woher kennst du die Stelle?'],['Hauptteil','Warum dieser Beruf, warum diese Firma, was kannst du schon? Mit Beispielen (Hobby, Schulfach, Ehrenamt).'],['Schluss und Gruß','„Über eine Einladung zu einem Vorstellungsgespräch freue ich mich.“ Dann „Mit freundlichen Grüßen“, Unterschrift.']],
merke:`<p><mark>Höchstens eine Seite. Keine Rechtschreibfehler. Jemand anderes liest Korrektur.</mark></p><p>Lebenslauf: tabellarisch, das Neueste oben.</p>`,
bsp:[],fehler:[['„Hiermit bewerbe ich mich …“ als erster Satz','Ein eigener Einstieg, z. B. „Seit ich bei meinem Onkel in der Werkstatt mithelfe …“','Der Standardsatz steht in jeder zweiten Bewerbung.']],
quiz:[{q:'Wie fängt der Text nach „Sehr geehrte Frau Yilmaz,“ an?',o:['Mit einem Großbuchstaben','Mit einem Kleinbuchstaben','Mit einem Doppelpunkt'],a:1}]},
{id:'d-indirekt',t:'Indirekte Rede (Konjunktiv I)',kurz:'Wiedergeben, was jemand gesagt hat',tag:'Klasse 9',
intro:`<p>Wenn du wiedergibst, was jemand gesagt hat, ohne es wörtlich zu zitieren, nimmst du die <b>indirekte Rede</b>. Dafür gibt es den <b>Konjunktiv I</b>.</p><div class="calc">Direkt: Lena sagt: „Ich bin müde.“<br>Indirekt: Lena sagt, sie <mark>sei</mark> müde.</div>`,
steps:[['Pronomen anpassen','„ich“ wird zu „er/sie“, „wir“ zu „sie“.'],['Konjunktiv I bilden','Wortstamm + Endung: er komm-e, sie hab-e, er sei, sie könne.'],['Klingt er wie der Indikativ? Dann Konjunktiv II','„Sie haben“ (Konj. I) klingt wie normal. Dann nimm „sie hätten“.'],['Notfalls würde-Form','Wenn auch Konjunktiv II komisch klingt: „sie würden kommen“.']],
merke:`<p><b>er/sie/es + e:</b> er gehe, sie habe, es könne. <b>sein:</b> er sei, sie seien.</p>`,bsp:[],fehler:[['Er sagt, er ist krank.','Er sagt, er sei krank.','In der Schule wird der Konjunktiv verlangt.']],
quiz:[{q:'Tim sagt: „Ich habe Hunger.“ Indirekt:',o:['Tim sagt, er hat Hunger.','Tim sagt, er habe Hunger.','Tim sagt, ich habe Hunger.'],a:1},{q:'Sie sagen: „Wir kommen morgen.“ Indirekt:',o:['Sie sagen, sie kommen morgen.','Sie sagen, sie kämen morgen.','Sie sagen, wir kämen morgen.'],a:1,h:'„sie kommen“ klingt wie normal, also Konjunktiv II.'}]},
{id:'d-komma',t:'Kommasetzung: das oder dass',kurz:'Die wichtigsten Kommaregeln',tag:'Wiederholung',
intro:`<p>Die meisten Kommafehler passieren bei Nebensätzen. Und bei <b>das</b> oder <b>dass</b>.</p>`,
steps:[['Probe: Kannst du „dieses“, „jenes“ oder „welches“ einsetzen?','Dann schreibst du <b>das</b>. Das Auto, <b>das</b> (welches) dort steht.'],['Wenn nicht: dass','Ich hoffe, <b>dass</b> es klappt. „Ich hoffe, welches es klappt“ geht nicht.'],['Komma vor Nebensatz','Vor weil, dass, obwohl, wenn, als, damit, der/die/das (Relativsatz) kommt ein Komma.'],['Aufzählungen','Komma zwischen den Teilen, außer vor „und“ / „oder“.']],
merke:`<p><mark>„dieses / welches“ passt → das. Passt nicht → dass.</mark></p>`,bsp:[],fehler:[['Ich glaube das er kommt.','Ich glaube, dass er kommt.','„welches er kommt“ geht nicht, also dass. Und Komma davor.']],
quiz:[{q:'Ich weiß, ___ du recht hast.',o:['das','dass'],a:1},{q:'Das Buch, ___ ich lese, ist spannend.',o:['das','dass'],a:0}]}
]},

englisch:{name:'Englisch',c:'var(--s-englisch)',desc:'If-clauses, Passive, Reported speech, Relative clauses',topics:[
{id:'e-if',t:'If-clauses (Typ 1, 2, 3)',kurz:'Bedingungssätze: wahrscheinlich, unwahrscheinlich, vorbei',tag:'Klasse 9',
intro:`<p>If-clauses sind „Wenn-dann-Sätze“. Es gibt drei Typen, je nachdem, wie realistisch die Bedingung ist.</p>
<div class="tbl"><table class="t"><tr><th>Typ</th><th>if-Teil</th><th>Hauptsatz</th><th>Bedeutung</th></tr>
<tr><td>1</td><td>simple present</td><td>will + Verb</td><td>gut möglich</td></tr>
<tr><td>2</td><td>simple past</td><td>would + Verb</td><td>unwahrscheinlich / Traum</td></tr>
<tr><td>3</td><td>past perfect (had + 3. Form)</td><td>would have + 3. Form</td><td>vorbei, nicht mehr änderbar</td></tr></table></div>`,
steps:[['Frag dich: Wie realistisch?','Kann es noch passieren (1)? Eher nicht (2)? Ist es schon vorbei (3)?'],['Zeit im if-Teil setzen','Typ 1: If it <b>rains</b> … &nbsp; Typ 2: If I <b>had</b> money … &nbsp; Typ 3: If I <b>had studied</b> …'],['Hauptsatz bilden','… we <b>will stay</b> at home. / … I <b>would buy</b> a car. / … I <b>would have passed</b> the test.'],['Nie „would“ im if-Teil','Das ist der häufigste Fehler.']],
merke:`<p><mark>Im if-Teil steht nie will oder would.</mark></p><p>Typ 2 mit „be“: If I <b>were</b> you …</p>`,
bsp:[{q:'Bilde einen Typ-3-Satz: Emre / learn / pass the test',s:['Typ 3 = vorbei, nicht mehr änderbar.','if-Teil: past perfect → If Emre had learned,','Hauptsatz: would have + 3. Form → he would have passed the test.'],r:'If Emre had learned, he would have passed the test.'}],
fehler:[['If I would have time, I would come.','If I had time, I would come.','Kein would im if-Teil.']],
quiz:[{q:'If it ___ tomorrow, we will stay at home.',o:['rains','rained','would rain','will rain'],a:0},{q:'If I ___ rich, I would travel the world.',o:['am','were','will be','have been'],a:1},{q:'If she had called, I ___ her.',o:['will help','would help','would have helped','helped'],a:2}]},
{id:'e-passive',t:'Passive voice',kurz:'Wenn wichtig ist, was passiert, nicht wer es tut',tag:'Klasse 9',
intro:`<p>Aktiv: <i>Tom <b>cleans</b> the car.</i> Passiv: <i>The car <b>is cleaned</b> (by Tom).</i></p><p>Bildung: <mark>Form von „be“ + 3. Form (past participle)</mark>. Die Zeit steckt in „be“.</p>
<div class="tbl"><table class="t"><tr><th>Zeit</th><th>Passiv</th></tr><tr><td>simple present</td><td>is / are cleaned</td></tr><tr><td>simple past</td><td>was / were cleaned</td></tr><tr><td>present perfect</td><td>has / have been cleaned</td></tr><tr><td>will-future</td><td>will be cleaned</td></tr><tr><td>mit can/must</td><td>can be cleaned</td></tr></table></div>`,
steps:[['Objekt nach vorne','Das Objekt aus dem Aktivsatz wird Subjekt.'],['Zeit vom Aktiv bestimmen','Die bleibt gleich und steckt jetzt in „be“.'],['be + 3. Form','was built, are made, has been sold.'],['„by …“ nur wenn wichtig','Meistens lässt man es weg.']],
merke:`<p><b>be (in der richtigen Zeit) + past participle</b></p>`,bsp:[],fehler:[['The house was build in 1990.','The house was built in 1990.','Dritte Form nehmen: build – built – built.']],
quiz:[{q:'Aktiv: They built the bridge in 2010. Passiv:',o:['The bridge is built in 2010.','The bridge was built in 2010.','The bridge has built in 2010.'],a:1},{q:'English ___ all over the world.',o:['speaks','is spoken','is speak','spoken'],a:1}]},
{id:'e-reported',t:'Reported speech',kurz:'Wiedergeben, was jemand gesagt hat',tag:'Klasse 9',
intro:`<p>Wenn das Einleitungsverb in der Vergangenheit steht (he said …), rückt die Zeit <b>einen Schritt zurück</b> (backshift).</p>
<div class="tbl"><table class="t"><tr><th>Direkt</th><th>Reported</th></tr><tr><td>simple present: „I like it.“</td><td>simple past: he said he liked it.</td></tr><tr><td>simple past / present perfect</td><td>past perfect: he had seen</td></tr><tr><td>will</td><td>would</td></tr><tr><td>can</td><td>could</td></tr><tr><td>today / tomorrow / here</td><td>that day / the next day / there</td></tr></table></div>`,
steps:[['Pronomen anpassen','„I“ wird zu he/she.'],['Zeit zurückschieben','Siehe Tabelle.'],['Orts- und Zeitangaben ändern','tomorrow → the next day.']],
merke:`<p><mark>said → eine Zeit zurück.</mark></p>`,bsp:[],fehler:[['She said she will come.','She said she would come.','will wird zu would.']],
quiz:[{q:'„I am tired,“ Tom said. → Tom said that he ___ tired.',o:['is','was','has been','will be'],a:1},{q:'„I will call you tomorrow.“ → She said she would call me ___.',o:['tomorrow','the next day','yesterday'],a:1}]},
{id:'e-relative',t:'Relative clauses',kurz:'who, which, that, whose',tag:'Wiederholung',
intro:`<p>Relativsätze beschreiben ein Nomen genauer.</p><p><b>who</b> für Personen, <b>which</b> für Dinge und Tiere, <b>that</b> für beides, <b>whose</b> für „dessen/deren“.</p>`,
steps:[['Nomen davor anschauen','Person oder Ding?'],['Pronomen wählen','The boy <b>who</b> lives next door. The bike <b>which</b> I bought.'],['Contact clause','Ist das Relativpronomen Objekt, darf es weg: The bike (which) I bought.']],
merke:`<p><mark>who = Person, which = Ding, whose = Besitz</mark></p>`,bsp:[],fehler:[['The man which helped me','The man who helped me','Für Personen who.']],
quiz:[{q:'The girl ___ sits next to me is from Spain.',o:['which','who','whose'],a:1},{q:'That is the man ___ car was stolen.',o:['who','which','whose'],a:2}]}
]},

bwr:{name:'BWR',c:'var(--s-bwr)',desc:'Hauptfach im kaufmännischen Zweig: Buchungssätze, Abschreibung, Lohn und Gehalt, Darlehen',topics:[
{id:'b-buchung',t:'Buchungssatz: so geht er immer',kurz:'Grundlage für alles in BWR',tag:'Wiederholung',
intro:`<p>Jeder Geschäftsfall wird als Buchungssatz geschrieben: <span class="f">Soll-Konto <b>an</b> Haben-Konto</span>.</p><p>Für Aktivkonten (Vermögen, z. B. Bank) gilt: Zugang links im Soll, Abgang rechts im Haben. Bei Passivkonten (Schulden) ist es genau umgekehrt.</p>`,
img:'tkonto',cap:'Aktivkonto Bank: Zugänge im Soll, Abgänge im Haben.',
steps:[['Welche Konten sind betroffen?','Lies den Beleg. Was verändert sich? Meistens zwei oder drei Konten.'],['Aktiv, Passiv, Aufwand oder Ertrag?','Vermögen (Maschinen, Bank) = aktiv. Schulden (Verbindlichkeiten, Darlehen) = passiv. Kosten = Aufwand (Klasse 6). Einnahmen aus Verkauf = Ertrag (Klasse 5).'],['Zugang oder Abgang?','Wird es mehr oder weniger?'],['Soll oder Haben?','Aktiv + / Aufwand: Soll. Aktiv − / Passiv + / Ertrag: Haben.'],['Satz aufschreiben','Kontonummer, Kurzname, Betrag. Soll an Haben. Summe Soll = Summe Haben.']],
merke:`<p><b>Soll an Haben.</b> Aktiv- und Aufwandskonten nehmen im Soll zu. Passiv- und Ertragskonten nehmen im Haben zu.</p><p><mark>Summe Soll = Summe Haben. Immer prüfen.</mark></p>`,
bsp:[{q:'Wir überweisen eine Rechnung über 2.380 € per Bank an unseren Lieferanten.',s:['Betroffen: Verbindlichkeiten (Schulden beim Lieferanten) und Bank.','Verbindlichkeiten = passiv, werden weniger → Soll.','Bank = aktiv, wird weniger → Haben.'],r:'4400 VE 2.380 € an 2800 BK 2.380 €'}],
fehler:[['2800 BK an 4400 VE beim Bezahlen','4400 VE an 2800 BK','Geld geht raus, die Bank nimmt ab, also Haben.']],
quiz:[{l:1,q:'Ein Kunde überweist uns 1.190 €. Welches Konto steht im Soll?',o:['2400 FO (Forderungen)','2800 BK (Bank)','4400 VE'],a:1},
{l:1,q:'Wir kaufen Rohstoffe auf Ziel (auf Rechnung). Welches Konto steht im Haben?',o:['2800 BK','4400 VE','2600 VORST'],a:1,h:'Auf Ziel heißt: Wir haben jetzt Schulden beim Lieferanten.'},
{l:2,q:'In welcher Seite nehmen Aufwandskonten zu?',o:['Soll','Haben'],a:0},
{l:2,q:'Wir zahlen die Miete über 1.000 € per Bank. Welcher Buchungssatz stimmt?',o:['6700 AWMP an 2800 BK','2800 BK an 6700 AWMP','4400 VE an 2800 BK'],a:0,h:'Miete ist Aufwand (Soll), Bank nimmt ab (Haben).'},
{l:3,q:'Maschine 10.000 € netto + 19 % USt. Bruttobetrag in €?',a:11900}]},
{id:'b-anlagen',t:'Anlagen kaufen und abschreiben',kurz:'Maschinen und Fahrzeuge, lineare Abschreibung',tag:'Klasse 9',
intro:`<p>Eine Maschine nutzt sich ab und verliert jedes Jahr an Wert. Diesen Wertverlust bucht man als <b>Abschreibung</b> (AfA). Er ist ein Aufwand.</p><p><b>Linear</b> heißt: jedes Jahr der gleiche Betrag.</p>`,
steps:[['Anschaffungskosten bestimmen','Nettopreis + Anschaffungsnebenkosten (Transport, Montage) − Nachlässe. Die Umsatzsteuer gehört nicht dazu.'],['Kauf buchen','0700 MA (Netto) + 2600 VORST an 4400 VE (Brutto).'],['Jahres-AfA ausrechnen','<div class="calc">AfA = Anschaffungskosten : Nutzungsdauer</div>'],['Monatsgenau','Im Kaufjahr zählt jeder angefangene Monat ab Kaufmonat. Kauf im April = April bis Dezember = 9 Monate.'],['Abschreibung buchen','6520 ABSA an 0700 MA.']],
merke:`<p><b>AfA pro Jahr = Anschaffungskosten : Nutzungsdauer</b></p><p><mark>Kaufmonat zählt mit.</mark></p>`,
bsp:[{q:'Kauf einer Maschine im April für 60.000 € netto + 19 % USt auf Ziel. Nutzungsdauer 10 Jahre. Buche Kauf und Abschreibung am 31.12.',s:['USt: 60.000 € · 0,19 = 11.400 €. Brutto: 71.400 €.','Kauf: 0700 MA 60.000 €, 2600 VORST 11.400 € an 4400 VE 71.400 €.','AfA pro Jahr: 60.000 € : 10 = 6.000 €.','April bis Dezember = 9 Monate: 6.000 € : 12 · 9 = 4.500 €.'],r:'31.12.: 6520 ABSA 4.500 € an 0700 MA 4.500 €'}],
fehler:[['Abschreibung vom Bruttopreis','Vom Nettopreis (Anschaffungskosten)','Die Vorsteuer bekommt das Unternehmen vom Finanzamt zurück.'],['Kauf im April = 8 Monate','9 Monate','Der Kaufmonat zählt mit.']],
quiz:[{l:1,q:'Fahrzeug 36.000 € netto, Nutzungsdauer 6 Jahre. Jahres-AfA in €?',a:6000},{l:1,q:'Kauf im Oktober. Wie viele Monate werden im Kaufjahr abgeschrieben?',a:3},
{l:2,q:'Maschine 50.000 € netto, Transport 2.000 € netto. Anschaffungskosten in €?',a:52000,h:'Nebenkosten gehören dazu.'},
{l:2,q:'Maschine 48.000 €, Nutzungsdauer 8 Jahre, Kauf im Juli. AfA im Kaufjahr in €?',a:3000,h:'48.000 : 8 = 6.000 pro Jahr. Juli bis Dezember = 6 Monate.'},
{l:3,q:'Welcher Buchungssatz für die Abschreibung stimmt?',o:['6520 ABSA an 0700 MA','0700 MA an 6520 ABSA','6520 ABSA an 2800 BK'],a:0},
{l:3,q:'Maschine 60.000 €, Nutzungsdauer 10 Jahre, Kauf im Januar. Wert am Ende des 1. Jahres in €?',a:54000,h:'60.000 − 6.000'}]},
{id:'b-personal',t:'Lohn und Gehalt',kurz:'Brutto, Netto, Abzüge buchen',tag:'Klasse 9',
intro:`<p>Vom Bruttogehalt gehen ab: <b>Lohnsteuer</b> (+ ggf. Kirchensteuer, Soli) an das Finanzamt und der <b>Arbeitnehmeranteil zur Sozialversicherung</b>. Was übrig bleibt, ist das <b>Netto</b>, das überwiesen wird.</p><p>Der Arbeitgeber zahlt zusätzlich noch einen <b>Arbeitgeberanteil</b> zur Sozialversicherung.</p>`,
steps:[['Netto ausrechnen','Brutto − Steuern − AN-Anteil SV = Netto.'],['Gehaltsbuchung','6300 GEH (Brutto) an 4830 VFA (Steuern), 4840 VSV (AN-Anteil), 2800 BK (Netto).'],['Arbeitgeberanteil buchen','6400 AGASV an 4840 VSV.']],
merke:`<p><b>Gehalt im Soll immer brutto.</b></p><p>4830 VFA = Schulden beim Finanzamt. 4840 VSV = Schulden bei der Sozialversicherung.</p>`,
bsp:[{q:'Bruttogehalt 3.000 €, Lohnsteuer usw. 400 €, AN-Anteil SV 600 €, AG-Anteil SV 600 € (vereinfachte Zahlen).',s:['Netto: 3.000 − 400 − 600 = 2.000 €.','6300 GEH 3.000 € an 4830 VFA 400 €, 4840 VSV 600 €, 2800 BK 2.000 €.','6400 AGASV 600 € an 4840 VSV 600 €.'],r:'Soll 3.000 € = Haben 400 + 600 + 2.000 €. Stimmt.'}],
fehler:[['6300 GEH mit dem Nettobetrag','Bruttobetrag','Der Aufwand für das Unternehmen ist das ganze Brutto.']],
quiz:[{l:1,q:'Brutto 2.500 €, Steuern 300 €, AN-Anteil SV 500 €. Netto in €?',a:1700},
{l:2,q:'Auf welches Konto kommt die einbehaltene Lohnsteuer?',o:['4830 VFA','4840 VSV','2800 BK'],a:0,h:'VFA = Verbindlichkeiten gegenüber Finanzbehörden.'},
{l:2,q:'Brutto 3.200 €, Steuern 380 €, AN-Anteil SV 650 €. Netto in €?',a:2170},
{l:3,q:'Brutto 3.000 €, AG-Anteil SV 600 €. Was kostet der Mitarbeiter das Unternehmen insgesamt in €?',a:3600,h:'Brutto + Arbeitgeberanteil'}]},
{id:'b-darlehen',t:'Darlehen und Zinsen',kurz:'Kredit aufnehmen, Zinsen berechnen und buchen',tag:'Klasse 9',
intro:`<p>Ein Unternehmen leiht sich Geld von der Bank: ein <b>Darlehen</b>. Dafür zahlt es <b>Zinsen</b>. Zinsen sind Aufwand (7510 ZAW).</p>`,
steps:[['Zinsformel','<div class="calc">Zinsen = Kapital · Zinssatz · Tage : (100 · 360)</div>In der kaufmännischen Rechnung hat jeder Monat 30 Tage, das Jahr 360.'],['Aufnahme buchen','2800 BK an 4250 LBKV.'],['Zinsen buchen','7510 ZAW an 2800 BK.']],
merke:`<p><b>Z = K · p · t : (100 · 360)</b></p><p><mark>1 Monat = 30 Tage, 1 Jahr = 360 Tage.</mark></p>`,

  };
  if(!ONLINE){sync.textContent='Speicher noch nicht verbunden: Es werden nur die Daten von diesem Gerät angezeigt.';draw(DAY?[DAY]:[],P);return}
  let pin='';try{pin=localStorage.getItem('emre-pin')||''}catch(e){}
  const load=async()=>{try{const r=await rpc('parent_data',{pin});if(!r.ok)throw 0;const res=await r.json();
    if(res===null){clearInterval(iv);try{localStorage.removeItem('emre-pin')}catch(e){}viewParent();return}
    const byDate={};(res.days||[]).forEach(d=>{const x=byDate[d.date]||(byDate[d.date]={date:d.date,total:0,topics:{},right:0,wrong:0,last:0});
      x.total+=d.total||0;x.right+=d.right||0;x.wrong+=d.wrong||0;x.last=Math.max(x.last,d.last||0);for(const k in d.topics||{})x.topics[k]=(x.topics[k]||0)+d.topics[k]});
    draw(Object.values(byDate),(res.progress||[]).reduce((a,p)=>mergeP(a,p),{}));sync.textContent='Live. Zuletzt aktualisiert: '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' (alle 20 Sekunden)';}
    catch(e){sync.textContent='Daten gerade nicht erreichbar. Neuer Versuch in 20 Sekunden.'}};
  const iv=setInterval(load,20000);load();
  parentUnsub=()=>clearInterval(iv);
}
window.addEventListener('hashchange',()=>{if(parentUnsub&&location.hash!=='#eltern'){parentUnsub();parentUnsub=null}});
function quizHTML(q,i){
  return `<div class="qq" data-q="${i}"><span class="qn">Aufgabe ${i+1}${q.l?`<span class="lv" title="${['','leicht','mittel','schwer'][q.l]}">${[1,2,3].map(k=>`<i class="${k<=q.l?'on':''}"></i>`).join('')}</span> ${['','leicht','mittel','schwer'][q.l]}`:''}</span><p>${q.q}</p>`+
  (q.o?`<div class="opts">${q.o.map((o,j)=>`<button class="opt" data-i="${j}">${o}</button>`).join('')}</div>`
      :`<div class="row"><input id="in-${i}" inputmode="decimal" autocomplete="off" aria-label="Deine Antwort" placeholder="z. B. −2 oder 1/2"><span class="keys"><button class="key" data-k="−" aria-label="Minus einfügen">−</button><button class="key" data-k="/" aria-label="Bruchstrich einfügen">/</button></span><button class="btn" data-check>Prüfen</button></div>`)+
  `<div class="fb" hidden aria-live="polite"></div></div>`;
}

function route(keep){
  const h=(location.hash||'#start').slice(1);curTopic=h;
  if(h==='eltern'){viewParent()}
  else if(DATA[h]){viewSubject(h)}
  else{let f=null;for(const [k,s] of Object.entries(DATA)){const t=s.topics.find(x=>x.id===h);if(t){f=[k,t];break}}
    if(f)viewTopic(f[0],f[1]);else viewStart();}
  if(keep!==true)window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
</script>
